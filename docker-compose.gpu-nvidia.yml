# Standalone NVIDIA GPU Compose file for stack-management UIs (Portainer,
# Coolify, Dockhand, etc.) that accept only a single Compose file and do not
# reliably honor COMPOSE_FILE or multiple `-f` overlays.
#
# This is equivalent to: docker-compose.yml + docker/gpu.nvidia.yml.
# The base docker-compose.yml plus the docker/gpu.nvidia.yml overlay remain
# the source of truth — CLI users should keep using the COMPOSE_FILE overlay
# workflow. Keep this file in sync with both when either changes.
#
# Requires the NVIDIA Container Toolkit on the host. See docker/gpu.nvidia.yml
# for setup details.
services:
  pantheon:
    image: ghcr.io/impanick/pantheon:latest
    pull_policy: always
    build: .
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-7000}:7000"
    volumes:
      - ${APP_DATA_DIR:-./data}:/app/data:z
      - ${APP_LOGS_DIR:-./logs}:/app/logs:z
      # Forge remote-server SSH identity. Pantheon can generate a key here;
      # add the shown public key to each remote server's authorized_keys.
      - ${APP_DATA_DIR:-./data}/ssh:/app/.ssh:z
      # Forge local model cache. Inside Docker, "Local" means the Pantheon
      # container, so persist its HuggingFace cache under ./data/huggingface.
      - ${APP_DATA_DIR:-./data}/huggingface:/app/.cache/huggingface:z
      # Forge-installed Python CLIs/packages (vLLM, llama-cpp-python, etc.)
      # land under /app/.local for the pantheon user. Persist them so a
      # container recreate does not silently remove installed serve engines.
      - ${APP_DATA_DIR:-./data}/local:/app/.local:z
      # The workstations' pairing tokens (`workstation` and `workstation-vm`
      # below) and the container's network gate's, read-only.
      - workstation-pairing:/workstation-pairing:ro
      - workstation-net-pairing:/workstation-net-pairing:ro
      - workstation-vm-pairing:/workstation-vm-pairing:ro
    # Pantheon's own browser (`src/local_browser.py`) is a headless Firefox,
    # whose content processes share memory through /dev/shm; Docker's 64 MB
    # default crashes tabs. A tmpfs limit, not memory set aside.
    shm_size: "1gb"
    extra_hosts:
      # Lets the container reach local services on the Docker host, including
      # Ollama at http://host.docker.internal:11434.
      - "host.docker.internal:host-gateway"
    environment:
      - LLM_HOST=${LLM_HOST:-localhost}
      - LLM_HOSTS=${LLM_HOSTS:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - SEARXNG_INSTANCE=http://searxng:8080
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/app.db}
      # Ignored since 0.2.0: there is always a sign-in (`D-2026-10-07-02` §2).
      # Passed through only so a value left in `.env` is named once in the log.
      # Who may make their own account is Settings > Users, off by default.
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - LOCALHOST_BYPASS=${LOCALHOST_BYPASS:-false}
      - COMPANION_BASE_URL=${COMPANION_BASE_URL:-}
      - PANTHEON_ADMIN_USER=${PANTHEON_ADMIN_USER:-admin}
      - PANTHEON_ADMIN_PASSWORD=${PANTHEON_ADMIN_PASSWORD:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      - SECURE_COOKIES=${SECURE_COOKIES:-}
      - EMBEDDING_URL=${EMBEDDING_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - FASTEMBED_MODEL=${FASTEMBED_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - FASTEMBED_CACHE_PATH=${FASTEMBED_CACHE_PATH:-}
      - CLEANUP_INTERVAL_HOURS=${CLEANUP_INTERVAL_HOURS:-24}
      - PANTHEON_INPROCESS_POLLERS=${PANTHEON_INPROCESS_POLLERS:-1}
      - PANTHEON_INPROCESS_TASKS=${PANTHEON_INPROCESS_TASKS:-1}
      - PANTHEON_TASK_CONCURRENCY_CAP=${PANTHEON_TASK_CONCURRENCY_CAP:-1}
      - PANTHEON_GITHUB_TOKEN=${PANTHEON_GITHUB_TOKEN:-}
      - PANTHEON_ALLOW_MODEL_DOWNLOAD=${PANTHEON_ALLOW_MODEL_DOWNLOAD:-0}
      - PANTHEON_ISSUE_TRACKER_URL=${PANTHEON_ISSUE_TRACKER_URL:-}
      - SEARXNG_WIDEN_ENGINES=${SEARXNG_WIDEN_ENGINES:-0}
      - PANTHEON_METRICS_ENABLED=${PANTHEON_METRICS_ENABLED:-0}
      - PANTHEON_SCRIPT_HOST=${PANTHEON_SCRIPT_HOST:-localhost}
      - PANTHEON_CHAT_UPLOAD_MAX_BYTES=${PANTHEON_CHAT_UPLOAD_MAX_BYTES:-10485760}
      - PANTHEON_GALLERY_UPLOAD_MAX_BYTES=${PANTHEON_GALLERY_UPLOAD_MAX_BYTES:-104857600}
      - PANTHEON_GALLERY_TRANSFORM_UPLOAD_MAX_BYTES=${PANTHEON_GALLERY_TRANSFORM_UPLOAD_MAX_BYTES:-26214400}
      - PANTHEON_MEMORY_IMPORT_MAX_BYTES=${PANTHEON_MEMORY_IMPORT_MAX_BYTES:-10485760}
      - PANTHEON_PERSONAL_UPLOAD_MAX_BYTES=${PANTHEON_PERSONAL_UPLOAD_MAX_BYTES:-26214400}
      - PANTHEON_EMAIL_COMPOSE_UPLOAD_MAX_BYTES=${PANTHEON_EMAIL_COMPOSE_UPLOAD_MAX_BYTES:-26214400}
      - PANTHEON_STT_MAX_AUDIO_BYTES=${PANTHEON_STT_MAX_AUDIO_BYTES:-26214400}
      - PANTHEON_ICS_MAX_BYTES=${PANTHEON_ICS_MAX_BYTES:-10485760}
      # `P2-24`. `:-` like the TTS cap below (`B63`): the number lives in
      # `src/upload_limits.py` and nowhere else.
      - PANTHEON_FONT_UPLOAD_MAX_BYTES=${PANTHEON_FONT_UPLOAD_MAX_BYTES:-}
      - PANTHEON_BACKUP_IMPORT_MAX_BYTES=${PANTHEON_BACKUP_IMPORT_MAX_BYTES:-26214400}
      # `B63`. `:-` and not `:-524288000`: the number lives in
      # `services/tts/tts_service.py` and duplicating it here would be two
      # places to change it (`Law 13`). The empty default only silences a
      # warning compose printed on every single command.
      - PANTHEON_TTS_CACHE_MAX_BYTES=${PANTHEON_TTS_CACHE_MAX_BYTES:-}
      - DATA_BRAVE_API_KEY=${DATA_BRAVE_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_PSE_CX=${GOOGLE_PSE_CX:-}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - MICROSOFT_OAUTH_CLIENT_ID=${MICROSOFT_OAUTH_CLIENT_ID:-}
      - MICROSOFT_OAUTH_CLIENT_SECRET=${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      - MICROSOFT_OAUTH_TENANT=${MICROSOFT_OAUTH_TENANT:-}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-}
      # Externally reachable origin for MCP OAuth callbacks. The container
      # always listens on 7000 and cannot see the host port map above, so
      # remote MCP OAuth needs this set whenever the browser reaches
      # Pantheon on anything other than http://localhost:7000.
      - OAUTH_REDIRECT_BASE_URL=${OAUTH_REDIRECT_BASE_URL:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      # `B1471`. docs/setup.md tells an operator to set these three in `.env`,
      # and a Docker install read none of them: `.env` is not in the image and
      # nothing forwarded them. Empty source/endpoint means "use the stored
      # setting or the default", as before; the engines carry their default
      # here because the reader takes an empty value as no engines at all.
      - PANTHEON_SOURCE_URL=${PANTHEON_SOURCE_URL:-}
      - PANTHEON_OTLP_ENDPOINT=${PANTHEON_OTLP_ENDPOINT:-}
      - SEARXNG_GENERAL_ENGINES=${SEARXNG_GENERAL_ENGINES:-bing,mojeek,presearch}
      # PUID / PGID — the user/group the container drops to before
      # running uvicorn (entrypoint also chowns /app/data + /app/logs
      # to match, so bind-mounted files stay editable from the host).
      # 1000 is the default first user on most Linux installs. If your
      # host user has a different id, override here or via .env, e.g.:
      #   PUID=1001
      #   PGID=1001
      # Find yours with:  id -u  /  id -g
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # The workstation: a virtual machine per person (`workstation-vm`
      # below), or the container (`workstation`) where Docker has no KVM.
      - PANTHEON_WORKSTATION_URL=http://workstation:7040
      - PANTHEON_WORKSTATION_NET_URL=http://workstation:7041
      - PANTHEON_WORKSTATION_VM_URL=http://workstation-vm:7040
      - PANTHEON_WORKSTATION_VM_PAIRING=/workstation-vm-pairing
      # NVIDIA overlay (from docker/gpu.nvidia.yml).
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    depends_on:
      searxng:
        condition: service_healthy
      chromadb:
        condition: service_started
    # `B440`. `up -d` returns when the container has *started*, and this app
    # binds 7000 only after it has finished importing itself — measured at
    # 7.4 s in a warm container here, 35-60 s on the deployment host, where the
    # entrypoint's ownership repair and `setup.py` run first and the page cache
    # is cold after a rebuild. With no healthcheck **Docker cannot tell
    # *running* from *serving***: `docker ps` says Up, every route answers
    # `Connection refused`, and a container that came up wedged looks exactly
    # like one that is fine.
    #
    # The probe is an HTTP request this app answered, not a process check.
    # `/api/ready` is in `app.py`'s `AUTH_EXEMPT_EXACT` for GET, so it answers
    # before anyone signs in: 200 with `{"ready": true}` when the database
    # answers and the data directory takes a write, 503 when either does not
    # (`B441` — it probed `/api/health` until 2026-10-26, which proves the app
    # is serving and not that it can keep anything, so a broken data mount
    # read `healthy`). Parsing the body is what makes a login redirect or an
    # error page *fail* the check rather than pass it.
    # `127.0.0.1`, not `localhost`: uvicorn binds `0.0.0.0`, which is IPv4
    # only, and `localhost` can resolve to `::1` first.
    #
    # `start_period` is twice the worst measured bind. Inside it a failing
    # probe does not count against `retries` and a passing one marks the
    # container healthy immediately, so the margin costs nothing on a healthy
    # start; what it costs is how long a container that never comes up stays
    # `starting` — 120 + 3x15 = 165 s before it reads `unhealthy`.
    # **Docker does not restart an unhealthy container**; `restart:
    # unless-stopped` acts on exit. This makes a wedge visible - to
    # `docker ps`, to `scripts/pantheon-deploy`, to any
    # `depends_on: condition: service_healthy` - it does not clear one.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json,sys,urllib.request as u; sys.exit(0 if json.load(u.urlopen('http://127.0.0.1:7000/api/ready', timeout=5)).get('ready') is True else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    # NVIDIA overlay (from docker/gpu.nvidia.yml).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  chromadb:
    # `B445`: pinned, not :latest. 1.5.9 is the release `chromadb-client==1.5.9`
    # in requirements.txt is cut from, and the tag `latest` resolved to when this
    # was pinned (both sha256:1e0b73a1…acdf6, pushed 2026-05-05, read from Docker
    # Hub 2026-10-28) — so the pin freezes what every install pulled since May
    # rather than choosing a version nobody has run. Move it with the client.
    image: docker.io/chromadb/chroma:1.5.9
    ports:
      - "${CHROMADB_BIND:-127.0.0.1}:8100:8000"
    volumes:
      # `B1626`: `/data` is where this image keeps its index. Its command is
      # `run /config.yaml`, and that file says `persist_path: "/data"` (read
      # from the 1.5.9 image's own layer; Chroma's 1.0 migration notes say the
      # same). The mount was `/chroma/chroma`, the 0.x path, so this volume
      # stayed empty and the index lived in the container's layer — kept
      # across a restart, lost on every recreate. Re-check it with the pin.
      - chromadb-data:/data
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  searxng:
    # Pinned, not :latest — pantheon waits on searxng's healthcheck
    # (depends_on: condition: service_healthy), so a broken upstream `latest`
    # tag blocks the whole app from starting. 2026.6.2 crashes on boot with
    # `KeyError: 'default_doi_resolver'`, failing the healthcheck (issue #1414).
    # Bump this deliberately after verifying a newer tag boots clean.
    image: docker.io/searxng/searxng:2026.5.31-7159b8aed
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        # `B1164`: each marker is a file this stack generated, never one a person wrote —
        # Pantheon's, and Odysseus's fixed secret that a kept `searxng-data` volume carries
        # across the upgrade — so both are regenerated from the template.
        if [ ! -s /etc/searxng/settings.yml ] || grep -q 'pantheon-local-searxng-json-2026-05-30\|odysseus-local-searxng-json-2026-05-30\|__SEARXNG_SECRET__' /etc/searxng/settings.yml; then
          secret="$${SEARXNG_SECRET:-}"
          if [ -z "$$secret" ]; then
            secret="$$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          fi
          sed "s|__SEARXNG_SECRET__|$$secret|g" /tmp/searxng-settings.yml.template > /etc/searxng/settings.yml
        fi
        # Advisory: a settings file the migration cannot parse or rewrite must
        # not be what stops searxng from booting. It explains itself on stderr
        # and we carry on, letting searxng report anything genuinely wrong.
        /usr/local/searxng/.venv/bin/python /tmp/migrate-searxng-settings.py /etc/searxng/settings.yml || true
        exec /usr/local/searxng/entrypoint.sh
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - searxng-data:/etc/searxng
      - ./config/searxng/settings.yml:/tmp/searxng-settings.yml.template:ro,z
      - ./scripts/migrate_searxng_settings.py:/tmp/migrate-searxng-settings.py:ro,z
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
    # The official searxng image runs as the non-root `searxng` user, but its
    # entrypoint still needs to chown /etc/searxng on first boot, drop privs via
    # su-exec, and (with our wrapper above) write settings.yml into the named
    # volume. Without these capabilities the wrapper aborts at the redirection
    # with EACCES and the container fails its healthcheck with permission
    # errors during setup. Mirrors the cap set recommended by the upstream
    # searxng-docker compose file. See issue #721.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5).read(1)\""]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ntfy:
    # `B445`: pinned; this line carried no tag at all, which is :latest written
    # shorter. v2.34.0 is the tag `latest` resolved to when this was pinned
    # (both sha256:901e1450…b3792, pushed 2026-10-24, read 2026-10-28).
    image: docker.io/binwiederhier/ntfy:v2.34.0
    command: serve
    ports:
      - "${NTFY_BIND:-127.0.0.1}:8091:80"
    volumes:
      - ntfy-cache:/var/cache/ntfy
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://localhost:8091}
    restart: unless-stopped

  # The workstation's other kind — an Ubuntu container beside Pantheon, a Unix
  # account and a desktop per person in it — for a host whose Docker has no KVM.
  # The owner (2026-10-31), testing on such a host: *"Local test doesn't
  # populate a VM at all"* — an emulated VM takes the better part of an hour to
  # make its image and runs everything about ten times slower. Settings ->
  # Workstation -> Backend `auto` (the default) uses the VM below where Docker
  # can use KVM and this container where it cannot; an admin can pick either.
  # The two services are what `docker/workstation.yml` used to add; it is now
  # a shim that adds nothing.
  #
  # `P20-06`. The network the workstation has is the one the admin chose, held
  # where the workstation's root cannot reach. This container OWNS the network
  # namespace the workstation runs in (`network_mode` below) and is the only one
  # with CAP_NET_ADMIN — the one capability that writes the rules, argued in
  # `workstation/gate.py`: it changes this namespace's firewall and nothing on
  # the host, and every other capability is dropped. Recreate the workstation
  # after restarting this (`docker compose up -d`): a new namespace leaves the
  # old one with loopback only, which fails closed.
  workstation-net:
    build:
      context: ./workstation
    entrypoint: ["/usr/bin/tini", "--", "python3", "-m", "workstation.gate"]
    command: ["--bind", "0.0.0.0", "--port", "7041"]
    hostname: workstation
    networks:
      default:
        aliases: [workstation]
    environment:
      - PANTHEON_WORKSTATION_PAIRING_GID=${PGID:-1000}
    volumes:
      - workstation-net-pairing:/workstation-net-pairing
    cap_drop: [ALL]
    # NET_ADMIN writes the rules; CHOWN gives the token to Pantheon's group.
    cap_add: [NET_ADMIN, CHOWN]
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,sys,urllib.request as u; sys.exit(0 if json.load(u.urlopen('http://127.0.0.1:7041/v1/network', timeout=5)).get('mode') else 1)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # No Docker socket, not privileged, no added capability and CAP_NET_RAW taken
  # away; no Pantheon volume but the pairing one and the projects folder
  # (`B1417`: one folder per person in it, never `./data` itself).
  workstation:
    build:
      context: ./workstation
    command: ["--system", "ubuntu", "--bind", "0.0.0.0", "--port", "7040"]
    network_mode: "service:workstation-net"
    depends_on:
      workstation-net:
        condition: service_healthy
    cap_drop: [NET_RAW]
    environment:
      - PANTHEON_WORKSTATION_PAIRING_GID=${PGID:-1000}
    volumes:
      - workstation-homes:/home
      - workstation-pairing:/workstation-pairing
      - ${APP_DATA_DIR:-./data}/projects:/projects:z
    # Firefox's content processes share memory through /dev/shm, and Docker's
    # 64 MB default crashes tabs. A tmpfs limit, not memory set aside.
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,sys,urllib.request as u; sys.exit(0 if json.load(u.urlopen('http://127.0.0.1:7040/v1/health', timeout=5)).get('agent') == 'pantheon-workstation' else 1)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # The workstation — a virtual machine of their own for each person, that the
  # agent works inside: its shell, Python and files, a desktop the person can
  # watch and take over, and a Firefox there. The owner (2026-10-31): *"We need
  # to give this a proper VM to work inside for the workstation."* Until then it
  # was an overlay to add to COMPOSE_FILE by hand, so Settings -> Workstation ->
  # On had nothing to talk to. It is `docker/workstation-vm.yml`'s host under
  # the name `docker/workstation-both.yml` gave it, with the same volume, so a
  # machine made under either is kept.
  #
  # It costs nothing until it is used: no machine runs, and the Ubuntu image
  # every machine is made from is made only when an admin first turns the
  # workstation on (`PANTHEON_WORKSTATION_VM_IMAGE=on_first_use`) — minutes
  # with KVM, much longer without. Each machine then takes up to
  # PANTHEON_WORKSTATION_VM_MEMORY_MIB while it runs and is powered off after
  # PANTHEON_WORKSTATION_VM_IDLE_MIN minutes unused (`B979`).
  #
  # Not privileged, no Docker socket, no capability added, no published port:
  # one device-cgroup rule for /dev/kvm alone (QEMU's emulator when the host has
  # none — the panel says which), its own volume, the pairing volume, and the
  # projects folder (`B1427`: each person's machine sees its own folder in it).
  # The browser does NOT need it: Pantheon has one of its own, and uses it
  # whenever the workstation cannot answer yet.
  workstation-vm:
    build:
      context: ./workstation
      dockerfile: vm.Dockerfile
    hostname: workstation-vm
    environment:
      - PANTHEON_WORKSTATION_PAIRING_GID=${PGID:-1000}
      - PANTHEON_WORKSTATION_VM_IMAGE=${PANTHEON_WORKSTATION_VM_IMAGE:-on_first_use}
      - PANTHEON_WORKSTATION_VM_MEMORY_MIB=${PANTHEON_WORKSTATION_VM_MEMORY_MIB:-2048}
      - PANTHEON_WORKSTATION_VM_CPUS=${PANTHEON_WORKSTATION_VM_CPUS:-2}
      - PANTHEON_WORKSTATION_VM_DISK_GIB=${PANTHEON_WORKSTATION_VM_DISK_GIB:-20}
      - PANTHEON_WORKSTATION_VM_ACCEL=${PANTHEON_WORKSTATION_VM_ACCEL:-auto}
      - PANTHEON_WORKSTATION_VM_IDLE_MIN=${PANTHEON_WORKSTATION_VM_IDLE_MIN:-30}
      - PANTHEON_WORKSTATION_VM_MAX_RUNNING=${PANTHEON_WORKSTATION_VM_MAX_RUNNING:-auto}
    volumes:
      - workstation-vm:/var/lib/pantheon-workstation-vm
      - workstation-vm-pairing:/workstation-pairing
      - ${APP_DATA_DIR:-./data}/projects:/projects:z
    device_cgroup_rules:
      - "c 10:232 rwm"
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,sys,urllib.request as u; sys.exit(0 if json.load(u.urlopen('http://127.0.0.1:7040/v1/health', timeout=5)).get('agent') == 'pantheon-workstation' else 1)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Each machine is powered off cleanly (its disk is people's work), which
    # takes longer than Docker's default ten seconds.
    stop_grace_period: 2m
    restart: unless-stopped

volumes:
  searxng-data:
  chromadb-data:
  ntfy-cache:
  workstation-homes:
  workstation-pairing:
  workstation-net-pairing:
  workstation-vm:
  workstation-vm-pairing:
