# The workstation as an Ubuntu container — `P20-01`, `D-2026-09-30-03`.
#
# Since 2026-10-31 this is part of Pantheon's own docker-compose.yml, with no
# overlay: services `workstation-net` and `workstation`, beside the VM host
# `workstation-vm`. The owner, testing on Docker Desktop with no KVM: *"Local
# test doesn't populate a VM at all."* Settings -> Workstation -> Backend `auto`
# (the default) uses a VM per person where Docker can use KVM and this
# container where it cannot; an admin can pick either. Read those services'
# comments for what each is given and what it is not.
#
# This file is kept so a COMPOSE_FILE line that still names it keeps working,
# and defines nothing of its own: it restates the two lines it used to add to
# Pantheon, which docker-compose.yml now sets the same way.
services:
  pantheon:
    environment:
      - PANTHEON_WORKSTATION_URL=http://workstation:7040
      - PANTHEON_WORKSTATION_NET_URL=http://workstation:7041
