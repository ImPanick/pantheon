# Android on a worker on the host itself (`python -m workstation.native_android.bootstrap up`),
# in place of the Android VM service (`android-vm` in docker-compose.yml): a Mac,
# whose Docker has no KVM, or an admin who runs the worker by hand.
# Set PANTHEON_ANDROID_PAIRING_DIR to the host worker's private pairing folder.
services:
  pantheon:
    environment:
      PANTHEON_ANDROID_URL: ${PANTHEON_ANDROID_URL:-http://host.docker.internal:7993}
      PANTHEON_ANDROID_TOKEN_FILE: /android-pairing/token
      PANTHEON_ANDROID_TLS_PIN: ${PANTHEON_ANDROID_TLS_PIN:-}
    volumes:
      - type: bind
        source: ${PANTHEON_ANDROID_PAIRING_DIR:?Set the Android host pairing folder}
        target: /android-pairing
        read_only: true
        bind:
          create_host_path: false
  # The host's worker runs the phones, so the service does not start with the
  # rest: one Android host, never two answering for the same people.
  android-vm:
    profiles: ["android-vm-service"]
