# The workstation as virtual machines — `P20-07`, `D-2026-09-30-03`.
#
# Since 2026-10-31 this is what Pantheon's own docker-compose.yml runs, with no
# overlay: service `workstation-vm`, a VM of their own for each person (the
# owner: *"We need to give this a proper VM to work inside for the
# workstation"*). Read that service's comment for what it is given and what it
# is not; Settings -> Workstation -> On is all it takes.
#
# This file is kept so a COMPOSE_FILE line that still names it keeps working,
# and defines no host of its own: the one it used to define (`workstation`)
# would be a second VM host on the same `workstation-vm` volume. An install that
# ran it has that container left over — `docker compose up -d --remove-orphans`
# removes it; every person's machine is on the volume and is kept. (The VM
# host also refuses to start on a volume another host holds, `workstation/vm.py`.)
services:
  pantheon:
    environment:
      - PANTHEON_WORKSTATION_VM_URL=http://workstation-vm:7040
