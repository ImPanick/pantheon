#
# gitleaks configuration — `B851`, corrected by `B863`.
#
# The first CI run this repository ever completed scanned 2,202 commits and
# reported four findings. All four are **fake secrets on purpose**, and three of
# them are inside the tests that prove this product redacts secrets. A scanner
# flagging the redaction tests as a leak is the scanner working and the
# allowlist being absent.
#
# `B863`: the first attempt at this file put the allowlist inside a `[[rules]]`
# block whose `id` was `generic-api-key`. `useDefault = true` does not MERGE a
# rule of the same id — it REPLACES it. So the default rule's own allowlist and
# stopwords went with it, the hand-copied regex became a second copy of
# something upstream maintains, and the run came back with a finding the
# original four had never included. The allowlist is global now: every default
# rule is exactly what gitleaks ships, and the five original literals are
# excused on top of all of them. The later redaction fixtures below are handled
# with the same exact-literal rule.
#
# The rule for this file, and it is the only rule: **an entry names one exact
# literal and says why that literal is not a credential.** No path allowlists —
# allowlisting `tests/` would mean a real key pasted into a test is never seen
# again, and a test is exactly where somebody pastes one while debugging. No
# commit fingerprints either: `.pantheon/`'s transfer procedure re-authors
# commits, so a fingerprint is a value that changes for reasons unrelated to
# what it pins, which is the shape `B520` names.
#
# `tests/test_the_secret_sweep_is_allowlisted_honestly.py` holds every entry to
# that rule: each regex must match something in the tree, must match only at the
# paths its comment names, and must carry a reason.

[extend]
useDefault = true

[allowlist]
description = "fake secrets that exist in order to be redacted, one literal at a time"
regexTarget = "match"
regexes = [
  # `tests/test_diagnostic_bundle.py` — the redaction table. Every string in it
  # is an input the bundle redactor must remove, and the test asserts it is
  # gone. A sequential alphabet after the prefix; no service ever issued one.
  '''ghp_ABCDEFGHIJKLMNOP1234''',
  '''sk-proj-AAAABBBBCCCCDDDDEEEEFFFF''',
  # The same table's generic case: `("api_key=abc123def456", "abc123def456")`.
  # Twelve characters of the first two rows of a keyboard, asserted absent from
  # the redactor's output on the next line. `B863` — this one is why the
  # allowlist had to stop replacing the default rule: it was suppressed by
  # gitleaks' own stopwords until this file overrode them.
  '''abc123def456''',
  # `tests/test_a_failure_that_does_not_say_why.py` — the same shape for a
  # different redactor. The test's assertion is `secret not in blob`.
  '''PATIENT-RECORD-8891-Jane-Doe''',
  # `library/ecc/skills/api-design/SKILL.md` — a bundled skill's worked example
  # of an API-key header, inside a fenced code block, teaching the reader what
  # the header looks like. `sk_live_abc123` is six characters of `abc123`.
  '''sk_live_abc123''',
  # `tests/test_a_stopped_agent_says_what_it_was_doing.py` feeds a fake
  # Stripe-shaped token into safe_arguments and asserts it is withheld. Its
  # hex-looking suffix is fixed test data, never an issued credential.
  '''sk-live-4f9a8b7c6d5e4f3a\b''',
  # The same test drives a repeated-call stop and asserts that its fake token
  # appears neither in the stop event nor in saved metrics. Distinct literal
  # from the shorter fixture above; both must remain independently exact.
  '''sk-live-4f9a8b7c6d5e4f3a2b1c\b''',
  # The command-withholding table also uses an AWS-shaped sample key with the
  # alphabet in order after AKIA; it is an impossible issued key by design.
  '''AKIAABCDEFGHIJKLMNOP\b''',
  # `tests/test_the_palette_offers_what_the_agent_reaches.py` and
  # `tests/test_an_http_step_goes_through_an_integration.py` use this same
  # deliberately misspelled sample key to assert an Integration's credential
  # never appears in the workflow palette and reaches only its HTTP request.
  '''sekret-api-key-123\b''',
  # `tests/test_a_mail_attachment_keeps_its_name_on_the_way_out.py` tests a
  # legacy staged filename: a repeated ascending hex sequence plus a human
  # title. The scanner's match ends after `_Q3`, before the first space.
  '''0123456789abcdef0123456789abcdef_Q3\b''',
  # The same test uses the sequence by itself as a synthetic staging key and
  # checks the path lookup. The boundary keeps it distinct from `_Q3` above.
  '''0123456789abcdef0123456789abcdef\b''',
]
