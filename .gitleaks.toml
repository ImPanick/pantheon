#
# gitleaks configuration — `B851`.
#
# The first CI run this repository ever completed scanned 2,202 commits and
# reported four findings. All four are **fake secrets on purpose**, and three of
# them are inside the tests that prove this product redacts secrets. A scanner
# flagging the redaction tests as a leak is the scanner working and the
# allowlist being absent.
#
# The rule for this file, and it is the only rule: **an entry names one exact
# literal and says why that literal is not a credential.** No path allowlists —
# allowlisting `tests/` would mean a real key pasted into a test is never seen
# again, and a test is exactly where somebody pastes one while debugging. No
# commit fingerprints either: `.pantheon/`'s transfer procedure re-authors
# commits, so a fingerprint is a value that changes for reasons unrelated to
# what it pins, which is the shape `B520` names.
#
# `tests/test_the_secret_sweep_is_allowlisted_honestly.py` holds every entry to
# that rule: each regex must match something in the tree, must match only at the
# paths its comment names, and must carry a reason.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "generic api key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;]|$)'''
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

  [rules.allowlist]
  regexTarget = "match"
  regexes = [
    # `tests/test_diagnostic_bundle.py` — the redaction table. Every string in it
    # is an input the bundle redactor must remove, and the test asserts it is
    # gone. A sequential alphabet after the prefix; no service ever issued one.
    '''ghp_ABCDEFGHIJKLMNOP1234''',
    '''sk-proj-AAAABBBBCCCCDDDDEEEEFFFF''',
    # `tests/test_a_failure_that_does_not_say_why.py` — the same shape for a
    # different redactor. The test's assertion is `secret not in blob`.
    '''PATIENT-RECORD-8891-Jane-Doe''',
    # `library/ecc/skills/api-design/SKILL.md` — a bundled skill's worked example
    # of an API-key header, inside a fenced code block, teaching the reader what
    # the header looks like. `sk_live_abc123` is six characters of `abc123`.
    '''sk_live_abc123''',
  ]
