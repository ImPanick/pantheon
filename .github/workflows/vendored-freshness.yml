# The half of `B330` that needs the network, kept out of the offline gate.
#
# `.pantheon/check-vendored-versions.py` answers "do the bytes match the record"
# and must work with no network, because developers run
# `.pantheon/release-gate.py --fast` offline and constantly (`Law 16`: the
# *product* never reaches an external service; CI may).
#
# This workflow answers the other question — "is the record still the newest
# thing upstream published, and does anyone know of an advisory affecting what
# we ship" — which cannot be answered without asking somebody. It asks two
# places, both read-only and unauthenticated:
#
#   registry.npmjs.org   what the record's `dist_tag` resolves to for each
#                        package -- `latest` for most, `stable-0.27` for
#                        Pyodide, whose npm `latest` is a different version
#                        line altogether (`B335`)
#   api.osv.dev          which advisories affect package@version -- for the
#                        vendored package AND for every package the record
#                        says is inside it (`B336`: html2pdf.js 0.14.0 has no
#                        advisory of its own and carries jsPDF 4.0.0 with nine
#                        and DOMPurify 3.3.1 with eighteen)
#
# It runs weekly and on demand, never on push: a PR should not go red because
# somebody else cut a release while it was open, and a developer should not have
# to wait on two APIs to find out whether their own change is sound.
#
# SheetJS is the reason `registry` is a field rather than an assumption. Its
# releases live on `cdn.sheetjs.com`; npm's `xlsx` stopped at 0.18.5 in 2022,
# which is OLDER than what Pantheon ships, so asking npm about it would report a
# downgrade as an upgrade and both of its CVEs as live. See CREDITS.md.
name: Vendored freshness

on:
  schedule:
    # Mondays, 06:17 UTC. Off the hour on purpose: every scheduled workflow on
    # GitHub fires at :00 and the queue for that minute is the longest one.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vendored-freshness
  cancel-in-progress: false

jobs:
  freshness:
    name: Are the vendored libraries still current?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      # The offline check first. If the recorded hashes do not match the tree,
      # asking upstream anything is premature — we do not yet know what we ship.
      - name: The record matches the bytes
        run: python3 .pantheon/check-vendored-versions.py

      - name: Ask npm and OSV about every recorded version
        run: |
          python3 - <<'PY'
          import json, subprocess, sys, urllib.error, urllib.request

          UA = {"User-Agent": "pantheon-vendored-freshness"}

          def get(url, data=None):
              req = urllib.request.Request(url, data=data, headers=dict(UA))
              if data is not None:
                  req.add_header("Content-Type", "application/json")
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)

          records = json.loads(subprocess.run(
              [sys.executable, ".pantheon/check-vendored-versions.py", "--json"],
              capture_output=True, text=True, check=True).stdout)

          behind, vulnerable, unknown, filed, excused = [], [], [], [], []
          for rec in records:
              pkg, ver, reg = rec["package"], rec["version"], rec["registry"]

              # 1 — is there something newer?
              # `dist_tag` is which tag to compare against, and it is a field
              # because of Pyodide (`B335`): npm's `latest` is 314.x, a
              # CPython-aligned line that 0.27.x does not belong to, so asking
              # for `latest` reports a maintained runtime as permanently
              # behind. The record names `stable-0.27` and this asks for that.
              if reg == "npm":
                  tag = rec.get("dist_tag") or "latest"
                  try:
                      tags = get(
                          "https://registry.npmjs.org/"
                          + urllib.request.quote(pkg, safe="@")
                      )["dist-tags"]
                  except (urllib.error.URLError, KeyError, ValueError) as exc:
                      unknown.append(f"{pkg}: registry said {exc}")
                      tags = {}
                  latest = tags.get(tag)
                  if tags and latest is None:
                      unknown.append(
                          f"{rec['entry']}: the record asks for dist-tag "
                          f"{tag!r} and npm publishes "
                          f"{sorted(tags)} — the line may have been retired"
                      )
                  if latest and latest != ver:
                      line = f"{rec['entry']}: shipping {ver}, npm latest is {latest}"
                      # Being behind is allowed only when a roadmap row owns the
                      # decision. A light that is always on is a light nobody
                      # reads, and "we know, here is the row" is the difference
                      # between a backlog and a shrug.
                      (filed if rec["behind_ok"] else behind).append(
                          line + (f"  [{rec['behind_ok']}]" if rec["behind_ok"] else "")
                      )
              else:
                  # No machine-readable index. Named rather than skipped, so a
                  # library whose upstream cannot be polled is still somebody's
                  # job rather than quietly exempt.
                  unknown.append(
                      f"{rec['entry']}: registry={reg!r} has no index this job "
                      f"can read — check {rec['source']} by hand"
                  )

              # 2 — does anyone know of an advisory against what we ship?
              # OSV is asked for the npm coordinate whatever the registry is:
              # the advisories are about the code, not about where it was
              # downloaded from. Read CREDITS.md before believing an `xlsx` hit.
              try:
                  vulns = get("https://api.osv.dev/v1/query", json.dumps({
                      "package": {"name": pkg, "ecosystem": "npm"},
                      "version": ver,
                  }).encode()).get("vulns", [])
              except (urllib.error.URLError, ValueError) as exc:
                  unknown.append(f"{pkg}@{ver}: OSV said {exc}")
                  vulns = []
              for v in vulns:
                  sev = (v.get("database_specific") or {}).get("severity", "")
                  line = f"{rec['entry']} {pkg}@{ver}: {v['id']} {sev}"
                  why = rec["osv_known"].get(v["id"])
                  if why:
                      excused.append(f"{line}\n      {why}")
                  else:
                      vulnerable.append(line)

              # 3 — `B336`. The packages INSIDE a bundle, at the versions its
              # bytes carry. A vendored bundle is one npm coordinate to this
              # workflow and a dozen to an attacker: html2pdf.js 0.14.0 has
              # zero advisories of its own and ships jsPDF 4.0.0 with nine and
              # DOMPurify 3.3.1 with eighteen. Asking about the outer package
              # only was how twenty-seven advisories sat in a roadmap row that
              # nothing re-counted. `check-vendored-versions.py` rule 6 checks
              # each of these versions against the shipped bytes offline, so
              # what is asked here is what is actually in the file.
              for inner in rec.get("contains", []):
                  ipkg, iver = inner["package"], inner["version"]
                  where = f"{rec['entry']} ⊃ {ipkg}@{iver}"
                  try:
                      ilatest = get(
                          "https://registry.npmjs.org/"
                          + urllib.request.quote(ipkg, safe="@")
                      )["dist-tags"]["latest"]
                  except (urllib.error.URLError, KeyError, ValueError) as exc:
                      unknown.append(f"{ipkg}: registry said {exc}")
                      ilatest = None
                  if ilatest and ilatest != iver:
                      line = (f"{where}: the bundle carries {iver}, npm latest "
                              f"is {ilatest}")
                      (filed if inner["behind_ok"] else behind).append(
                          line + (f"  [{inner['behind_ok']}]"
                                  if inner["behind_ok"] else "")
                      )
                  try:
                      ivulns = get("https://api.osv.dev/v1/query", json.dumps({
                          "package": {"name": ipkg, "ecosystem": "npm"},
                          "version": iver,
                      }).encode()).get("vulns", [])
                  except (urllib.error.URLError, ValueError) as exc:
                      unknown.append(f"{ipkg}@{iver}: OSV said {exc}")
                      ivulns = []
                  for v in ivulns:
                      sev = (v.get("database_specific") or {}).get("severity", "")
                      line = f"{where}: {v['id']} {sev}"
                      why = inner["osv_known"].get(v["id"])
                      if why:
                          excused.append(f"{line}\n      {why}")
                      else:
                          vulnerable.append(line)

          def section(title, lines):
              print(f"\n## {title}")
              print("\n".join(f"  {l}" for l in lines) if lines else "  none")

          section("Behind upstream, with no row that owns it", behind)
          section("Advisories against what we ship", vulnerable)
          section("Behind upstream, filed", filed)
          section("Advisory hits explained in the record", excused)
          section("Could not be asked", unknown)

          if behind or vulnerable:
              print(
                  "\nFAIL. Bump the library, record the new version, hash and "
                  "today's date in .pantheon/check-vendored-versions.py, and "
                  "update the CREDITS.md row.\nIf a hit is a false positive — "
                  "`xlsx` always is, see CREDITS.md — say so in the record's "
                  "`note` and in the roadmap row, not in a comment here."
              )
              sys.exit(1)
          print("\nOK — every vendored library is at its upstream latest and "
                "OSV knows nothing against it.")
          PY
