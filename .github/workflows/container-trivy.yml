# Container image vulnerability scan (advisory)
#
# Trivy builds the application image and scans it for known-vulnerable OS and
# Python packages. Its FINDINGS are advisory -- they land in the repo's Security
# tab without blocking a merge, because the image inevitably contains
# already-known CVEs in upstream packages that are not this project's bug.
#
# `B435`: whether it LOOKED is not advisory. `continue-on-error` sat on both
# jobs until 2026-09-17, so a failed image build or a failed SARIF upload
# reported a green tick over a Security tab nothing had reached. The flag is on
# the scan step now, and its name says so.
#
# Split from the Dockerfile lint (container-scan.yml) for two reasons:
#
#   - Least privilege. The image build runs Dockerfile instructions, which on a
#     pull request are attacker-influenceable. That path (the `scan` job) is
#     held to a read-only token and never publishes results. Only `publish`,
#     which runs on push to main (curated, fast-forwarded from reviewed dev),
#     gets security-events:write to upload SARIF.
#   - Cost. Docs-only changes do not rebuild the image (paths-ignore below),
#     matching docker-publish.yml. hadolint stays on the broad trigger in
#     container-scan.yml so the blocking gate always reports.

name: Container scan (Trivy)

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: container-trivy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests and manual runs: build and scan under a read-only token.
  # The build executes PR-supplied Dockerfile instructions, so this job must
  # not hold any write scope, and it does not upload to the Security tab.
  scan:
    name: Trivy (image scan, advisory)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # `B435`. `continue-on-error` used to sit HERE, on the job, which made the
    # whole job advisory — including the checkout and the image build. A
    # Dockerfile that would not build reported a green tick, and the tick meant
    # "I did not look" rather than "I looked and found nothing that blocks
    # you". The flag belongs on the one step whose FINDINGS are advisory, and
    # that is where it is now: **advisory about what it finds, never about
    # whether it looked.**
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4.4.0

      # Build without pushing so a broken Dockerfile is caught here, and the
      # exact image we ship is what gets scanned.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: pantheon:ci

      - name: Scan image with Trivy (advisory — findings do not block)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: pantheon:ci
          format: table
          # `B323`. This flag silently drops every finding with no published
          # fix — which is exactly PYSEC-2026-1215 against basicsr 1.4.2, the
          # one advisory this image actually carries. The flag stays: a fixless
          # CVE in an upstream package must not block a merge on an advisory
          # scan. What was missing was any record of what it was dropping, and
          # that is now D-2026-09-16-01 plus the entry in
          # .pantheon/dependency-advisories.toml, which the blocking pip-audit
          # job in dependency-review.yml prints with its full reasoning.
          ignore-unfixed: true
        env:
          # Pin the vuln DB source to GHCR to avoid rate-limited Docker Hub
          # mirrors that flake on shared runners.
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2

  # Push to main only: build, scan, and publish SARIF to the Security tab.
  # This is the only path that runs trusted code, so it is the only one granted
  # security-events:write.
  publish:
    name: Trivy (image scan + SARIF upload)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # `B435`, and this job was the worse of the two: the flag on the job meant
    # a failed SARIF upload reported success, and the upload is the entire
    # point — `docs/security-ci.md` sends the reader to the Security tab for
    # Trivy's findings, so a green tick over a tab nothing reached is the
    # documentation being wrong with a tick beside it.
    permissions:
      contents: read
      security-events: write  # upload SARIF to the Security tab
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4.4.0

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: pantheon:ci

      - name: Scan image with Trivy (advisory — findings do not block)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: pantheon:ci
          format: sarif
          output: trivy-results.sarif
          # See the note on the same flag in the `scan` job above, and
          # D-2026-09-16-01.
          ignore-unfixed: true
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
