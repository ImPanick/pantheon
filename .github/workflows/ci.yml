name: CI

on:
  push:
    # `B433`. This said `[main, dev]` from the fork baseline until 2026-09-17
    # and there has never been a `dev` branch, so half of this trigger has
    # never fired. `B352` corrected the PR and issue templates that sent
    # contributors to the same branch and the workflows were missed.
    # `.pantheon/check-ci-contract.py` rule 3 is what fails now if a trigger
    # names a branch this repository does not have.
    branches: [main]
  pull_request:

# Least privilege: none of the jobs write to the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-test-guidance:
    name: Focused test guidance (report-only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Report changed test paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          report_file="$RUNNER_TEMP/focused-test-guidance.md"
          publish_report() {
            cat "$report_file"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              cat "$report_file" >> "$GITHUB_STEP_SUMMARY" || true
            fi
            return 0
          }

          report_unavailable() {
            {
              printf '%s\n\n' '## Focused test guidance unavailable (report-only)'
              printf '%s\n\n' "$1"
              printf '%s\n' 'Existing blocking CI remains the source of truth.'
            } > "$report_file"
            publish_report
            exit 0
          }

          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            report_unavailable "Pull request base/head metadata is missing."
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            report_unavailable "The pull request base commit is unavailable locally."
          fi

          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            report_unavailable "The pull request head commit is unavailable locally."
          fi

          if ! python3 .github/scripts/focused_test_guidance.py \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" > "$report_file"; then
            report_unavailable "The focused test guidance helper could not produce a report."
          fi

          publish_report

  python-syntax:
    name: Python syntax (compileall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      # Byte-compile sources — catches syntax errors without installing deps.
      #
      # `B436`. This used to be `compileall app.py core routes src services
      # scripts tests`, a second hand-typed list of which Python is ours, and
      # it had drifted exactly the way `B10`'s JavaScript list did: on
      # 2026-09-17 it missed **51 of the 1,429 tracked `.py` files, including
      # all 22 checkers this workflow then runs**, `launcher.py`,
      # `.github/scripts/`, and every module under `companion/`,
      # `mcp_servers/` and `netagent/`. A checker with a syntax error in it
      # fails at the step that runs it, with a traceback instead of a
      # compile error, on a job nobody expects to be about syntax.
      #
      # There is one list now and it is `_python_files()` in the gate, the same
      # direction the node step already takes.
      - name: py_compile
        run: |
          python3 -c "
          import importlib.util, subprocess, sys
          spec = importlib.util.spec_from_file_location('gate', '.pantheon/release-gate.py')
          gate = importlib.util.module_from_spec(spec); spec.loader.exec_module(gate)
          files = gate._python_files()
          print(f'{len(files)} python files')
          sys.exit(subprocess.run([sys.executable, '-m', 'py_compile', *files]).returncode)
          "

  wiring-ratchet:
    name: Wiring ratchet (check-wiring.py --max 40)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      # Law 13 — nothing ships half-wired. Counts getElementById targets that
      # resolve to no markup and no runtime creation. The ceiling may fall and
      # may never rise; a PR that adds an unresolved lookup fails here.
      # No dependencies: the checker is stdlib plus `git ls-files`.
      #
      # 2 -> 9 on 2026-09-07, and NOT because anything regressed: P3-15 closed
      # three blind spots the checker had, so it now sees defects that were
      # always there. It never scanned static/app.js or static/sw.js at all; it
      # counted comments as code; and it ignored ids reached through a literal
      # collection, which is the shape that hid the discovery audit's
      # highest-harm finding. The nine are listed in P3-15's roadmap entry.
      # `P10-10`. The tracker checker existed for weeks and CI never ran it —
      # found by `release-gate.py` on its first run, which reads the checker
      # list out of *this file* precisely so a gap here shows up there. It
      # validates the roadmap's own arithmetic: that the status table agrees
      # with the ticks beneath it, that no id names two rows (`B48`), that the
      # newest Progress entry matches the totals (`B44`). All three of those
      # were real defects, and it caught a fresh one on 2026-09-10 — so a
      # roadmap that lies about itself has been pushable this whole time.
      - name: check-tracker
        run: python3 .pantheon/check-tracker.py

      # `B430`. The tracker above checks that the roadmap does not lie about
      # itself. This one checks that CI does not. It was written because on
      # 2026-09-17 nothing in this repository could answer "is the pipeline
      # green" — twenty-two of the last forty runs had failed, every one of
      # the eight successes was a Dependabot run or a Trivy job that skipped
      # its work, and five waves shipped that day each reporting "gate green"
      # from a local `release-gate.py --fast`. Seven rules: a required check
      # names a job that exists; the README carries a branch-pinned badge for
      # each; no trigger names a branch this repo does not have (`B433`); a
      # `continue-on-error` job says so in its name (`B435`); the local gate
      # reads its interpreter, node version and suite argv out of this file
      # rather than copying them (`B431`); neither syntax job keeps a second
      # list of which files are ours (`B436`); and a skip that says "this is
      # only documentation" can prove it (`B434`).
      - name: check-ci-contract
        run: python3 .pantheon/check-ci-contract.py

      # `P17-06`. A tool name has to be registered in up to eight places and a
      # name missing from any one of them fails silently and differently. That
      # has shipped three times now — the cookbook family, `tail_serve_output`,
      # and `B66`'s `manage_rag`, which the system prompt ordered the agent to
      # use while the fence parser dropped every call without an error.
      - name: check-tool-surface
        run: python3 .pantheon/check-tool-surface.py
      # B74. The register above says a tool name must be in every register; this
      # one says the registers have to AGREE. Thirteen tools are served by an
      # MCP server and declared to Pantheon, each spelled out twice, and no pair
      # matched. `send_email` accepted `cc` and `bcc` in the handler and
      # declared them on the server while the register the model reads named
      # neither — so the agent could not cc anybody, on a capability that
      # worked. Same for `reply_to_email` and `reply_all`. The two copies are
      # read by different audiences, so the one that rots is the one nobody here
      # runs. Schemas are compared by CALLING `list_tools()`, because a server
      # that builds its schema at runtime is still serving one (Law 20).
      - name: check-mcp-schemas
        run: python3 .pantheon/check-mcp-schemas.py

      - name: check-wiring
        run: python3 .pantheon/check-wiring.py --max 40
      # Law 14, arrived at by accident. A module imported under two URLs is two
      # modules with two copies of its state, and nothing breaks loudly when it
      # happens — a registry written through one specifier is simply empty when
      # read through the other. Eleven modules were forked this way when the
      # check was written; two features were silently dead because of it.
      - name: check-specifiers
        run: python3 .pantheon/check-specifiers.py --max 0
      # OpenMoji's artwork shipped under CC BY-SA 4.0, credited in no file in
      # the repository, from before the fork until 2026-09-01 — and two vendor
      # marks in static/icons/ went the same way. None of it was a missing
      # rule. It was that nothing ever compared the tree against CREDITS.md.
      # This is that comparison, and the inventory is an allowlist: a vendored
      # file nobody has written a licence line for fails here.
      - name: check-licences
        run: python3 .pantheon/check-licences.py
      # Law 16 clause 4, armed before the hole exists. P16-12 builds the first
      # legitimate place in this codebase for an outbound metrics URL, and so
      # the first place a well-meant default could land — a "community stats"
      # endpoint, or an SDK whose constructor has a hosted collector in it and
      # whose docs call that the quickstart. Primary rule is an allowlist over
      # shape, not a denylist of vendor names: every telemetry vendor was new
      # once, and the one that matters is the one nobody has heard of yet.
      - name: check-destinations
        run: python3 .pantheon/check-destinations.py
      # P15-10. The audit that opened P15 ran this grep:
      #   grep -rnE "jitter|random\.uniform|random\.randint" src/ routes/ services/ app.py
      # and found nothing but a comment. Not one recurring job in the product
      # had jitter, so every install fired the same job at the same instant and
      # a shared provider saw a spike per hour rather than a rate. That state
      # arrived through nobody deciding anything — an exact sixty seconds is
      # simply what you write — so fixing the call sites without leaving this
      # behind guarantees the next loop is bare again. It is invisible from
      # inside a single install, which is why it survived until CI looked.
      - name: check-jitter
        run: python3 .pantheon/check-jitter.py
      # P15-06. Two rules. The budget can go down and never up — a hard zero
      # today would be a lie, because most of what is left is the agent's own
      # tools calling Pantheon's HTTP API on loopback, where pacing is free but
      # converting a hundred call sites in one commit is how you ship a
      # regression nobody can bisect. The rule with NO budget is a call to a
      # host carrying an explicit HostPolicy — GitHub, HuggingFace, DuckDuckGo —
      # because those policies exist only because those hosts have already
      # throttled this product.
      - name: check-outbound
        run: python3 .pantheon/check-outbound.py --max 116
      # P3-15. The other half of the same disease check-wiring measures: an
      # element id with no markup and a route with no caller are both something
      # that was built and never wired, and nothing in CI noticed because
      # nothing was broken. The hand audit that found these produced the 21 `H`
      # rows — a complete embedding-model manager with zero pixels, session
      # cleanup with an unreachable dry run — and this rediscovers them from a
      # clean checkout. An inventory with a ceiling, not an accusation: an API
      # token, a CLI or the agent's own app_api may be the caller, so the
      # ALLOWED map names the ones that are not the browser.
      - name: check-unreachable
        run: python3 .pantheon/check-unreachable.py --max-routes 91
      # P0-31. A rename that finishes on one side of a join is invisible: the
      # writers move, the readers do not, and nothing raises. It happened four
      # times from one sweep — the API token prefix a person pastes into
      # another machine, the tmux session name the agent's shell is *found* by,
      # sixteen dead stylesheet selectors that killed the pre-paint sidebar
      # guard, and five suite failures that stood for a fortnight looking like
      # flake. Reads code and not prose, so a comment explaining what the old
      # name was survives; every real hit is a named migration path.
      - name: check-fork-names
        run: python3 .pantheon/check-fork-names.py
      # P0-18. `AGPL-3.0` and `AGPL-3.0-or-later` are different licences to
      # anyone combining this with something else, and which one Pantheon is
      # under was stated exactly once, in a README badge. The second rule is
      # the one that matters: a vendored file must NOT carry our identifier,
      # because stamping AGPL on somebody else's MIT build is a claim about
      # work this project has no standing to relicense — and P0-16's first
      # attempt already went wrong in that direction once, pointed the other way.
      - name: check-spdx
        run: python3 .pantheon/check-spdx.py
      # P3-16. PandaOS permanently lost user API keys to one shape: a read with
      # a silent fallback (`except: return {}`) feeding a write. Neither half is
      # wrong alone and they are usually in different files, so no analysis
      # decides it — but the set of files this app rewrites in place is small
      # and closed, and each one has an answer. `guarded` stores refuse to
      # overwrite a target they could not read; `strict-read` ones raise before
      # the write; `rebuildable` ones must NOT be guarded, because overwriting
      # a corrupt one is how they are repaired. A new config file with no answer
      # fails this, which is the point: the decision is cheap now and expensive
      # after somebody's keys are gone.
      - name: check-config-writes
        run: python3 .pantheon/check-config-writes.py
      # P11-02b / P11-02d. Both rows asked for a map of where authorization is
      # decided and for nothing to be changed until it existed. A map is the
      # artefact this tracker keeps getting wrong: P11-02b said 84 sites while
      # its own phase preamble said 103 thirty lines above, and P11-02d named
      # `chat_routes.py:338/367` as chat's admin check when those two lines are
      # `_candidate_index` and `_message_plain_text`. So .pantheon/P11-AUTH-MAP.md
      # is held against the tree here: every `require_admin` site appears with a
      # tier (resolved through `import ... as`, because five of them answer to
      # `_require_admin` and a grep finds none of those), every mapped site still
      # exists, every route in the fifteen files carries the gate the source
      # actually gives it, and a route the map calls unintended has to name a
      # `Bxxx`. Rule C is a ratchet on admin decisions taken WITHOUT
      # `require_admin` — there are three other ways to ask, `routes/auth_routes.py`
      # holds 22 of them, and only `require_admin` honours `auth_disabled()`
      # (`B543`). It may fall as they move onto P11-02's roles; it may not rise.
      - name: check-auth-map
        run: python3 .pantheon/check-auth-map.py --max 43
      # P19. The ledger is the copy shown to strangers, which makes it the worst
      # one to let drift: `.pantheon/ROADMAP.md` records what was done,
      # `CHANGELOG.md` records what changed because AGPL-3.0 §5(a) requires it,
      # and a third file restating those numbers in marketing voice is `Law 13`.
      # So LEDGER.md is generated and this fails when the tree's copy is not what
      # the claims produce — hand-editing it breaks CI on the next run, which is
      # the only reliable way to stop somebody doing it. It also refuses a claim
      # citing a file that no longer exists, a roadmap row that was never
      # written, an `after` with no `before`, and — the specific honesty this
      # file would most like to lose — a retrieval number that has quietly
      # dropped its `fixture` tag.
      - name: check-ledger
        run: python3 .pantheon/check-ledger.py
      # B59. A `navigator.clipboard.writeText` with no fallback is not a style
      # preference — `navigator.clipboard` is undefined outside a secure
      # context, and `Law 17` calls plain http on a LAN the normal way to reach
      # this app. So the property access throws, nothing is copied, and nothing
      # is said. Two call sites were exactly that shape and both mattered: the
      # API-token button, on the one control that shows a token once, and the
      # webhook-URL button, which said "Copied" afterwards regardless. Image
      # copies are exempt by the shape of the problem rather than by name —
      # `execCommand` cannot copy an image, so there is no legacy path to
      # demand. The ceiling is zero and it starts there.
      - name: check-clipboard
        run: python3 .pantheon/check-clipboard.py --max 0
      # B111. The six run statuses are declared twice on purpose — once as
      # `TASK_RUN_STATUSES` in core/database.py and once as `RUN_STATUSES` in
      # static/js/runStatus.js — and a test already asserts the two lists match.
      # What nothing checked is the way all six actually got into the tree: bare
      # string literals at fifteen sites in src/task_scheduler.py. A sixteenth
      # writing `run.status = "cancelled"` passed every gate here and reached the
      # UI, where `runStatusTone` answered null, the Activity view fell back to
      # scanning the result text for the word "error", and the notification
      # client called it a failure. This reads both vocabularies out of the
      # files, checks the word table and the notification policy are exactly as
      # wide as them, and walks the AST for a status literal written to a
      # TaskRun row that nobody declared.
      - name: check-run-statuses
        run: python3 .pantheon/check-run-statuses.py
      # B161. `B100` replaced the server's two hand-written extension lists with
      # one derivation in src/document_processor.py. The browser kept four
      # copies of the old shape — chat.js twice, document.js, documentLibrary.js
      # — and none of them knew .toml, .markdown, .kt, .swift or .h, so a file
      # the composer labelled `toml` was offered as plain text by the document
      # editor it opened in. The client cannot import a Python register, so the
      # two registers in static/js/attachmentLanguage.js are GENERATED from it
      # and this is what keeps them honest: the block byte for byte, and the
      # rule itself compared answer by answer over every alias key and every
      # ingestible extension. A hand-copied list is not wrong today, it is wrong
      # about the next language added.
      - name: check-attachment-language
        run: python3 .pantheon/check-attachment-language.py
      # P3-17. The row's own acceptance test — zero bare `except:` — passed on
      # the unfixed tree, so it would have been ticked without a fix. The real
      # population is `except ...: pass`, and grep cannot count it: `grep -A1`
      # miscounts multi-line handlers in both directions, which is why the row
      # carried three different numbers. Two rules, because a flat count would
      # say the same thing about swallowing `os.unlink(tmp)` as about
      # swallowing a schema migration. The hard one is zero and stays zero.
      - name: check-silent-failures
        run: python3 .pantheon/check-silent-failures.py --max 402
      # P3-23. Four sources of truth about this product's configuration and no
      # two agree: what the code reads, what .env.example declares, what compose
      # forwards, what docs/setup.md explains. An operator looks in
      # .env.example. `H08` is what the gap costs — the switch that uncaps every
      # local agent run appeared nowhere outside the module that read it, so the
      # only way to turn the behaviour off was to already know its name. The
      # second rule is the sharper one and is zero: a knob documented and read
      # by nothing is worse than an undocumented one, because an operator who
      # sets it believes something changed.
      - name: check-env-declared
        run: python3 .pantheon/check-env-declared.py --max 71
      # P4-11. The round has been on the wire since the first agent loop and it
      # was on most events; the gaps were invisible because nothing rendered it.
      # The streamed result card had none while its persisted twin did, the
      # approved-action replay hardcoded 0 at four sites, the one-shot image
      # path sent none, and the skill-test log kept it on the step and dropped
      # it from the tools inside the step. Four files, one rule — so it is a
      # checker and not four fixes. Ratchet is zero: a card that cannot name
      # its round is the whole defect.
      - name: check-event-rounds
        run: python3 .pantheon/check-event-rounds.py
      # `B320`/`B322`. requirements.txt held 31 dependencies and zero `==`
      # pins, which made the build irreproducible, let a yanked or compromised
      # release land on the next build with nobody's name on it, and — the part
      # that is easy to miss — made the pip half of .github/dependabot.yml
      # inert. Dependabot bumps a pinned version; a bare `fastapi` is satisfied
      # by every release fastapi ever made, so the automation was configured,
      # reviewed, merged, and could not have opened a single Python PR. The
      # ratchet is zero: a new dependency added without a pin fails here.
      # Second rule, same file: every entry in
      # .pantheon/dependency-advisories.toml must name the bug, why it cannot
      # be reached here, what upstream offers, what would change the answer,
      # the DECISIONS.md entry behind it, and a review date — which the checker
      # fails on once it passes. An unexplained suppression is the defect class
      # this project keeps finding. Offline by construction (`Law 16`); the
      # half that needs a network is the blocking pip-audit job in
      # .github/workflows/dependency-review.yml.
      - name: check-pins
        run: python3 .pantheon/check-pins.py

      # `B330`. A vendored library's version lived in CREDITS.md prose and
      # nowhere a machine looked, so the versions drifted and the only way
      # anyone learned how far was a hand research pass — which on 2026-09-16
      # found mammoth.js eighteen releases behind, html2pdf.js carrying a jsPDF
      # with twelve open advisories, and node-qrcode with no recorded version at
      # all because the file matched no published artifact. This fingerprints
      # every file under static/lib/ against a recorded sha256 and checks that
      # CREDITS.md prints the recorded version, so the bytes and the record
      # cannot disagree. Offline by construction (`Law 16`): asking a registry
      # whether something NEWER exists is a different question and lives in
      # .github/workflows/vendored-freshness.yml, which is allowed the network.
      - name: check-vendored-versions
        run: python3 .pantheon/check-vendored-versions.py

      # `P13-13`. NOT a checker and deliberately not a gate — it exits 0
      # whatever it finds. `P14-02` already records how many memories a search
      # asked for and how many came back, and "returned 5" is not "returned the
      # right 5", so this is the first number in the tree that can tell one
      # retrieval engine from another. It runs here so the figure appears in
      # every build log and a change in it is noticed, not so a build fails on
      # it: a ratchet on a number nobody has calibrated is `P3-20`'s mistake.
      # The shipped corpus is a harness fixture and says so in its own header;
      # a real measurement needs an operator's own memories.
      - name: retrieval eval (report only)
        run: python3 .pantheon/retrieval_eval.py --verbose

  law16-egress:
    name: Law 16 — no egress on a fresh install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pytest
      # Law 16 — a fresh install reaches nothing until someone links something.
      #
      # Every finding in P16 was found by a person reading code. That works once
      # and does not hold: the next convenience default will look as reasonable
      # as `npx -y @playwright/mcp@latest` did, and its comment will explain the
      # choice just as plainly. This makes the machine try instead.
      #
      # The guard sits at socket.connect and getaddrinfo, not at httpx —
      # guarding a library would have missed the npm fetch, which went out
      # through subprocess, and that was the worst offender of the lot.
      - name: no egress on boot
        run: python3 -m pytest tests/test_no_egress_on_boot.py tests/test_self_hosted_defaults.py -q -p no:randomly

  node-syntax:
    name: JS syntax (node --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
      # Syntax-check our own JS. `B10`: this step used to be its own loop over
      # `static/app.js static/js/**/*.js`, and it checked NOTHING on the first
      # of those. `node --check <path>` resolves module type from the nearest
      # `package.json`; the root one has no `"type"`, so `static/app.js` parses
      # as CommonJS, and node's module-syntax detection retries the failed
      # parse as ESM and does not re-check — so any file containing `import`
      # passed unconditionally, including one whose body is
      # `this is not javascript at all !!! ( [ {`. Measured on node 20 and 22.
      # `docs/security-ci.md` names this step as a required, merge-blocking
      # status check, which made it the loudest false gate in the repo.
      #
      # It also kept a SECOND list of which files are ours, and the two had
      # already drifted: this loop covered 173 files and never named
      # `static/sw.js`, which the gate has always checked (`Law 13`). The gate
      # is now the single list and this step calls it — the same direction
      # `release-gate.py` already takes for the checker list it reads out of
      # this file.
      - name: node --check
        run: |
          python3 -c "
          import sys, importlib.util
          spec = importlib.util.spec_from_file_location('gate', '.pantheon/release-gate.py')
          gate = importlib.util.module_from_spec(spec); spec.loader.exec_module(gate)
          ok, msg = gate._node_check(gate._js_files())
          print(msg)
          sys.exit(0 if ok else 1)
          "

  python-tests:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    # Make Python test validation authoritative for the configured scope.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Detect whether this change only touches documentation files.
      # If so, skip the expensive pytest run while still reporting a passing check.
      #
      # `B434`. The decision used to be a shell pipeline ending in
      # `if [ -z "$non_docs" ]`, and **its empty case answered yes**: a push
      # whose `before` is the zero sha, a force-push whose base is gone, or any
      # `git diff` that failed at all produced an empty `changed`, which fed
      # `grep` one blank line, which left `non_docs` empty, which meant
      # docs-only — so `Python tests (pytest)` reported SUCCESS having run no
      # tests. Two different questions had one answer: "is every changed file
      # documentation" and "could the change set be computed".
      #
      # The decision now lives in `.github/scripts/docs_only.py`, where the
      # suite can call it with a list and where an empty list answers `false`
      # (run them). The shell here only collects paths; it decides nothing.
      # `${{ }}` values go through `env:` rather than into the script body —
      # a workflow that pastes event data into a shell is the template
      # injection zizmor exists to find.
      - name: Check for docs-only changes
        id: docs-check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"; HEAD="$PR_HEAD"
          else
            BASE="$PUSH_BEFORE"; HEAD="$PUSH_AFTER"
          fi
          changed="$RUNNER_TEMP/changed-files.txt"
          git diff --name-only "$BASE" "$HEAD" > "$changed" 2>/dev/null \
            || git diff --name-only HEAD~1 HEAD > "$changed" 2>/dev/null \
            || : > "$changed"
          python3 .github/scripts/docs_only.py --changed-from "$changed" \
            >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: steps.docs-check.outputs.docs_only != 'true'
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.docs-check.outputs.docs_only != 'true'
      - run: mkdir -p data  # sqlite DB lives at ./data/app.db
        if: steps.docs-check.outputs.docs_only != 'true'
      - run: python -m pytest -q
        if: steps.docs-check.outputs.docs_only != 'true'
