# Supply-chain review
#
# Purpose: defend against "side-chain" / supply-chain attacks -- a pull request
# that adds (or bumps) a dependency to a version with a known vulnerability or a
# disallowed license. Two layers:
#
#   - dependency-review: runs ONLY on pull requests. It compares the
#     dependencies before and after the PR and blocks the merge if the change
#     pulls in a package with a known security advisory. This is the gate.
#   - pip-audit: scans the project's pinned Python requirements against the
#     advisory database. **Blocking since `B322`.** It used to be advisory only,
#     on the reasoning that it could flag a pre-existing issue in an
#     already-shipped dependency that the pull request did not introduce. That
#     reasoning is right about the problem and wrong about the remedy: an
#     advisory check that never fails is a check nobody reads, and this
#     repository had twenty checkers in CI and not one of them audited a
#     dependency. The remedy is a register of accepted risks with reasoning
#     attached — `.pantheon/dependency-advisories.toml` — so a pre-existing
#     finding can be acknowledged in a reviewable diff instead of by turning the
#     gate off. `.pantheon/audit-dependencies.py` prints each accepted risk's
#     full reasoning next to whatever did fail, so the justification is in the
#     log a person is already reading.
#
# Scope note: this job audits requirements.txt, requirements-optional.txt,
# requirements-image.txt AND the Real-ESRGAN wheel pins, which live in a shell
# variable in docker/build-realesrgan-wheels.sh and are read from there rather
# than copied. Those three packages are installed into every image and appear in
# no requirements file, which is how basicsr's advisory came to be visible only
# to somebody who thought to run pip-audit inside a running container by hand.

name: Dependency review

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Default-deny token; jobs grant only read access.
permissions: {}

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review (PR gate)
    # Only meaningful on a pull request -- it needs a base..head diff to review.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          # Fail the PR on any newly introduced moderate-or-worse advisory.
          fail-on-severity: moderate

  pip-audit:
    name: pip-audit (blocking)
    runs-on: ubuntu-latest
    # Blocking. A finding with no entry in .pantheon/dependency-advisories.toml
    # fails this job, and so does an entry whose finding is no longer reported:
    # an ignore list that has outlived what it excused is how people stop
    # reading one.
    permissions:
      contents: read
    # The resolver walks the full dependency tree of every pinned requirement,
    # which for the optional set includes torch. Metadata only, but not instant.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          # 3.14 because that is what the image ships. The Python version is not
          # cosmetic here: requirements-optional.txt gates kokoro and soundfile
          # behind `python_version < "3.13"`, so auditing on an older
          # interpreter audits a dependency set the image does not install.
          python-version: '3.14'

      - name: Run the dependency audit
        run: |
          set -euo pipefail
          pip install pip-audit==2.10.1
          python3 .pantheon/audit-dependencies.py
