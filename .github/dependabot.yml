# Dependabot keeps dependencies and pinned action versions current.
#
# Why this matters for security: every workflow in this repo pins its GitHub
# Actions to an exact commit (a SHA), which is safe but freezes them in time.
# Dependabot opens a small, reviewable pull request whenever a newer version
# exists -- for Python packages, npm packages, the Docker base image, and the
# pinned Actions themselves -- so staying patched does not require manual work.
# Updates are grouped so a week's bumps arrive as one PR per ecosystem, not a
# flood of separate ones.
#
# `B320`. Read the paragraph above and then read requirements.txt as it stood
# until 2026-09-16: 31 dependencies, zero `==` pins. Dependabot raises a pull
# request when a PINNED version falls behind. A bare `fastapi` is satisfied by
# every release fastapi has ever made, so there was nothing for the pip
# ecosystem below to compare against and it could not have opened a single
# Python pull request in the months it had been configured. It was not broken;
# it was answering a question nobody had asked it. That is the shape worth
# remembering -- automation that looks like coverage on the config page and
# provides none -- and it is why `.pantheon/check-pins.py` now fails the release
# gate on an unpinned requirement, and why that checker also refuses a pinned
# requirements file sitting in a directory no entry below covers.

version: 2
updates:
  # Python dependencies. Directory "/" covers every requirements*.txt at the top
  # of the tree: requirements.txt (core), requirements-optional.txt (opt-in
  # features), requirements-image.txt (installed by the Dockerfile only) and
  # requirements-voice.txt (speech, installed by the Dockerfile by default).
  # `.pantheon/check-pins.py` fails if a pinned requirements file ever lands
  # outside a directory listed here.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # A new major of the MCP SDK is a migration of the built-in servers and the
    # client together, not a bump — `B621` was 1.x -> 2.x. Keep Dependabot to
    # minors and patches on the current line.
    #
    # PyAV 19 removed an argument faster-whisper 1.2.1 opens every recording
    # with, and local speech-to-text then hears nothing (`B1716`): its majors
    # wait for a faster-whisper release that does without it. The reason, and
    # the test that fails on the bump, are beside the pin in
    # requirements-voice.txt.
    ignore:
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
      - dependency-name: av
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]

  # Frontend / tooling npm packages (package.json).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]

  # The pinned action SHAs used across .github/workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  # The Docker base image in the Dockerfile.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # `B1677`. The workstation's two base images (`workstation/Dockerfile`,
  # `workstation/vm.Dockerfile`), pinned to a dated tag and its digest so a
  # rebuild cannot change them unseen — which also means nothing moves them but
  # this. `vm.Dockerfile`'s cloud image (`CLOUD_IMAGE_URL`/`CLOUD_IMAGE_SHA256`)
  # is not an image reference, and is moved by hand with its hash.
  - package-ecosystem: docker
    directory: "/workstation"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # `B1729`. Chatterbox, the voice for an NVIDIA GPU (`voice/chatterbox/`):
  # its pinned requirements and its PyTorch base image, pinned to a tag and
  # its digest. torch and torchaudio come with that image, at the versions
  # chatterbox-tts pins, so they move with it and never on their own.
  - package-ecosystem: pip
    directory: "/voice/chatterbox"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      chatterbox:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: "/voice/chatterbox"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
