# Adwaita's dark variant for every GTK 3 program (D-2026-10-31-02). The theme
# itself is named by xsettings.xml; Ubuntu ships the dark variant inside GTK,
# not as a theme of its own, so it is asked for here. This file is in the
# account's home; "Reset to clean" puts it back.
[Settings]
gtk-application-prefer-dark-theme=1
