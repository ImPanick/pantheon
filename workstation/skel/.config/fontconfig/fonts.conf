<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<!--
  The workstation desktop's type (D-2026-10-31-02): Inter wherever a program
  asks for a sans-serif and JetBrains Mono for monospace, Firefox's pages
  among them, with DejaVu behind both for what they do not cover. This file
  is in the account's home; "Reset to clean" puts it back.
-->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Inter</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Inter</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family><family>DejaVu Sans Mono</family></prefer>
  </alias>
</fontconfig>
