# `B450`. **There is no `[project]` table here and no `version` key, on purpose.**
#
# This file is habitually the first place a packaging tool or a contributor
# reaches for a version, and adding one here would make it the third — the
# application already declares its version twice, in `src/constants.py`
# (`APP_VERSION`, which `/api/version`, `/api/readiness`, `pantheon_build_info`,
# the diagnostic bundle, OTLP and `docker-publish.yml`'s image tag all read) and
# in `scripts/_lib/cli.py` (`VERSION`, which twenty `pantheon-*` executables
# print for `--version`). Those two are pinned to each other by
# `tests/test_one_version_string.py`, which also fails on a third. `Law 14`.
#
# The scheme — what the number means, and how it, the git tag and the newest
# `CHANGELOG.md` heading are kept equal — is in `CHANGELOG.md` § Versions.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Test-taxonomy markers added at collection time by tests/conftest.py. The
# stable area_* markers are declared here; the dynamic sub_<filename-token>
# markers are registered before collection by pytest_configure in
# tests/conftest.py, so unknown-mark warnings still flag genuine typos outside
# the taxonomy. See tests/_taxonomy.py and tests/README.md.
markers = [
    "area_security: tests covering auth, owner-scope, SSRF, XSS, confinement, redaction",
    "area_routes: tests covering HTTP route / API behavior",
    "area_services: tests covering service-layer behavior (llm, cookbook, email, calendar, ...)",
    "area_cli: tests covering CLI / script behavior",
    "area_js: JavaScript / Node-backed tests",
    "area_helpers: self-tests for the shared test helpers in tests/helpers/",
    "area_unit: pure parser / utility tests that do not clearly belong elsewhere",
    "area_uncategorized: tests not yet matched by the taxonomy (fallback)",
    # Fast-lane marker (issue #3443). Opt-in and orthogonal to the area_*/sub_*
    # taxonomy. The fast lane runs `not slow`; mark a test slow only with
    # duration evidence (see tests/run_focus.py --durations and tests/README.md).
    "slow: opt-in marker for known-slow tests; excluded by the fast lane (not slow)",
]

# `B2114`. The one lint CI enforces: names that crash when the line runs.
#
# Nothing in CI read Python for anything but syntax (`compileall`), so a name
# that is never defined shipped as long as no test happened to reach its line.
# `B2113` is the proof: `src/workstation_client.py` named `SOURCE_ENV`, which
# does not exist, on the https branch every dedicated Android host takes, and
# the first request raised `NameError`. pyflakes' undefined-name family
# (F821-F823), syntax and IO errors (E9), and the comparisons and statements
# that are always a mistake (F63, F7) are the set where a finding is a bug,
# not a taste. The `Python lint` job in `.github/workflows/ci.yml` runs it on
# every tracked `.py` file and fails on one finding. Widen `select` by adding a
# family at zero, never by adding one with a baseline to ignore.
[tool.ruff]
target-version = "py311"
extend-exclude = ["static/lib", "node_modules"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
