<title>Pantheon — Login</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23e06c75' fill-rule='evenodd' d='M5.18 12A11 11 0 0 1 26.82 12L25.74 12L16 7.82L6.26 12ZM16 10L30 16L2 16ZM4 18L28 18L28 20L4 20ZM5 20L8 20L8 26L5 26ZM11.33 20L14.33 20L14.33 26L11.33 26ZM17.67 20L20.67 20L20.67 26L17.67 26ZM24 20L27 20L27 26L24 26ZM2 26L30 26L30 28L2 28Z'/%3E%3C/svg%3E">
<link rel="manifest" href="static/manifest.json">
<link rel="apple-touch-icon" href="static/icons/icon-192.png">
<script>
(function(){
  function computeAppBasePath() {
    var path = window.location.pathname || '/login';
    if (path === '/login') {
      return '';
    }
    if (path.endsWith('/login')) {
      return path.slice(0, -'/login'.length).replace(/\/+$/, '');
    }
    return '';
  }
  var appBasePath = computeAppBasePath();
  window.__pantheonLoginBasePath = appBasePath;
  window.__pantheonLoginAppUrl = function(path) {
    var normalizedPath = String(path || '/');
    if (!normalizedPath.startsWith('/')) {
      normalizedPath = '/' + normalizedPath;
    }
    return appBasePath + normalizedPath;
  };
  // Per-theme bg-effect defaults — mirrors THEME_DEFAULT_* maps in
  // static/js/theme.js so login picks the same default pattern as the
  // main app for users who never explicitly chose one.
  var THEME_DEFAULT_PATTERN = {
    dark:'none', light:'dots', midnight:'rain', paper:'dots',
    forest:'petals',
    ocean:'constellations', organs:'rain',
    ume:'petals', cute:'sparkles'
  };
  var THEME_DEFAULT_EFFECT_COLOR = {
    midnight:'#ffffff', organs:'#451616', cute:'#ff8cb8', ume:'#f5a0c0'
  };
  var THEME_DEFAULT_INTENSITY = { midnight:0.5, organs:0.65 };
  try {
    var t = JSON.parse(localStorage.getItem('pantheon-theme'));
    var s = document.documentElement.style;
    // A retired preset (theme.js `RETIRED_THEMES`) paints nothing here; the
      // module moves it to Dark on boot.
      if (t && /^(terminal|retrowave|cyberpunk)$/.test(t.name)) t = null;
      if (t && t.colors) {
      var c = t.colors;
      // Base palette
      s.setProperty('--bg', c.bg);
      // P3-09 — see `applyColors()` in static/js/theme.js for why this is
      // here. Native controls (select popups, scrollbars, checkboxes) are
      // painted by the browser and `color-scheme` is the only thing that
      // tells it which way; without this line a light theme opens a black
      // dropdown until the module boots, and on the login page forever.
      (function(){
        var d = String(c.bg || '').replace('#', '');
        var light = false;
        if (d.length === 6) {
          var lin = [0, 2, 4].map(function (i) {
            var ch = parseInt(d.slice(i, i + 2), 16) / 255;
            return ch <= 0.03928 ? ch / 12.92 : Math.pow((ch + 0.055) / 1.055, 2.4);
          });
          light = (0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2]) > 0.5;
        }
        s.setProperty('color-scheme', light ? 'light' : 'dark');
        document.documentElement.setAttribute('data-ck-tone', light ? 'light' : 'dark');
      })();
      s.setProperty('--fg', c.fg);
      s.setProperty('--panel', c.panel);
      s.setProperty('--border', c.border);
      if (c.red) s.setProperty('--red', c.red);
      // P1-01. `initThemeUI()` returns at its missing `#themeGrid` before it
      // reaches `applyColors()` — see the comment at the bottom of this file —
      // so this is the one screen the module never hands an accent to. The
      // single consumer below chains on to `--red`, so nothing looks wrong
      // today; the line is here so the next bare `var(--accent)` written on
      // this page is not dead on arrival. With no saved theme the token stays
      // unset and the `:root` block below carries the page, exactly as it does
      // for `--red`.
      var _ac = c.accent || c.red;
      if (_ac) s.setProperty('--accent', _ac);
      // `P1-08`, mirrored from `applyColors()` in static/js/theme.js. The
      // send button and 18 other rules take their foreground from
      // `--on-accent`; without this they paint with the stylesheet fallback
      // until the module boots, which is the unreadable white-on-accent
      // flash this row exists to end. Black or white, whichever clears —
      // the endpoints of the luminance range, so the winner is the best any
      // foreground can do. Measured on all 23 palettes by
      // `.pantheon/check-contrast.py`: worst case `claude` at 5.18:1.
      if (_ac) {
        var _lum = function (hx) {
          var h = String(hx).replace('#', '');
          if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
          var ch = [0, 2, 4].map(function (i) {
            var v = parseInt(h.substr(i, 2), 16) / 255;
            return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
          });
          return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
        };
        var _l = _lum(_ac);
        // Black wins a tie, exactly as `onAccentFor()` does: contrast with
        // black is (L+0.05)/0.05 and with white is 1.05/(L+0.05), so black
        // is at least as good precisely when (L+0.05)^2 >= 0.0525. One
        // inequality, no division, and the same branch on both sides.
        s.setProperty('--on-accent', ((_l + 0.05) * (_l + 0.05)) >= 0.0525 ? '#000000' : '#ffffff');
      }
      if (c.green) s.setProperty('--green', c.green);
      // Advanced overrides (sidebar logo color, input bg, send-button bg, etc.)
      // — mirrors ADV_KEYS in static/js/theme.js so the login page picks up
      // every customization the user has on their theme instead of falling
      // back to defaults that didn't match the main app.
      //
      // This page links no stylesheet, so only the rules in the <style> block
      // below can read any of these: `--brand-color` and `--brand-mix-to`, on
      // the wordmark. The other twelve are written against the day a rule here
      // wants one, and are kept key-for-key identical to `ADV_KEYS` because a
      // set that is *nearly* the same is the one shape nothing catches —
      // `brandMixTo` was missing from here alone, and the wordmark it feeds
      // was the one place on this page it would have shown (B21, 2026-08-30).
      var a = c.advanced || {};
      var ADV = {
        userBubbleBg:    '--user-bubble-bg',
        aiBubbleBg:      '--ai-bubble-bg',
        bubbleBorder:    '--bubble-border',
        sidebarBg:       '--sidebar-bg',
        brandColor:      '--brand-color',
        brandMixTo:      '--brand-mix-to',
        hamburgerColor:  '--hamburger-color',
        inputBg:         '--input-bg',
        inputBorder:     '--input-border',
        sendBtnBg:       '--send-btn-bg',
        sendBtnHover:    '--send-btn-hover',
        codeBg:          '--code-bg',
        codeFg:          '--code-fg',
        toggleActive:    '--toggle-active',
      };
      for (var k in ADV) { if (a[k]) s.setProperty(ADV[k], a[k]); }
    }
    // Background effect — pick ONE at random from the main app's 8
    // patterns each load (matches the old login behavior, but uses the
    // same effect implementations the main theme system exposes so the
    // login feels consistent with the rest of the app). Per-theme
    // bgEffectColor/Intensity defaults still apply so the random
    // pattern picks up theme-appropriate tinting.
    var name = (t && t.name) || '';
    // perlin-flow excluded — too visually intense for a login screen.
    var PATTERNS = ['dots','synapse','rain','constellations','petals','sparkles','embers'];
    var pattern = PATTERNS[Math.floor(Math.random() * PATTERNS.length)];
    var effColor = (t && t.bgEffectColor) || THEME_DEFAULT_EFFECT_COLOR[name] || '';
    var effInt = (t && t.bgEffectIntensity !== undefined)
      ? t.bgEffectIntensity
      : (THEME_DEFAULT_INTENSITY[name] !== undefined ? THEME_DEFAULT_INTENSITY[name] : 1);
    var effSize = (t && t.bgEffectSize !== undefined) ? t.bgEffectSize : 1;
    if (effColor) s.setProperty('--bg-effect-color', effColor);
    s.setProperty('--bg-effect-intensity', String(effInt));
    s.setProperty('--bg-effect-size', String(effSize));
    // Stash so the deferred module knows which canvas effect to start.
    window.__loginBgPattern = pattern;
    // Apply the body class as soon as <body> exists so static-gradient
    // patterns (dots, synapse) paint immediately on first frame.
    var apply = function() { document.body.classList.add('bg-pattern-' + pattern); };
    if (document.body) apply();
    else document.addEventListener('DOMContentLoaded', apply, { once: true });
  } catch(e){}
})();
</script>
<style>
  @font-face { font-family: 'Fira Code'; font-weight: 400; font-style: normal; font-display: swap; src: url('static/fonts/FiraCode-Regular.woff2') format('woff2'); }
  @font-face { font-family: 'Fira Code'; font-weight: 600; font-style: normal; font-display: swap; src: url('static/fonts/FiraCode-SemiBold.woff2') format('woff2'); }
  /* Mirror the main app's :root defaults (static/style.css ~line 18) so an
     uncustomized theme — or a fresh browser with no `pantheon-theme` in
     localStorage — renders the login page in the same palette as the rest
     of the app instead of a different greys+offwhite scheme. */
  :root {
    --bg: #282c34; --fg: #9cdef2; --panel: #111; --border: #355a66;
    --red: #e06c75; --green: #50fa7b;
    --bg-effect-intensity: 1;
    /* `B1575`. The muted foreground and its pivot, as `static/style.css`'s
       `:root` declares them (`P1-03`, `B1486`) — this page links no
       stylesheet, so without them it had no `--fg-muted`, and its secondary
       text mixed `--fg` toward `transparent` instead: the labels at 65%
       measured 2.53:1 on `retrowave`, the setup note at 60% 2.33:1, the
       sign-up line at 50% 1.96:1. Copied, not shared, for the reason the
       palette above is (`P10-05`): the first paint owes nothing to the app's
       sheet. `.pantheon/check-contrast.py` holds the two copies equal and
       measures the rungs below on every palette.
       `color-scheme` is `style.css`'s default too: `light-dark()` reads it,
       and the head script sets it from the saved palette's background. */
    color-scheme: dark;
    --color-muted: light-dark(#747474, #949494);
    --fg-muted: color-mix(in srgb, var(--fg) 30%, var(--color-muted));
    --color-error: light-dark(#d60000, #ff6363);
  }
  /* Background patterns — mirrors static/style.css "Background Patterns"
     block so the theme's chosen bgPattern renders on login too. The
     canvas-based effects (rain, constellations, perlin-flow, petals,
     sparkles, embers) are spawned by the deferred theme.js import below;
     the static gradient ones (dots, synapse) need these CSS rules. */
  #synapse-canvas, #rain-canvas, #constellations-canvas,
  #perlin-flow-canvas, #petals-canvas, #sparkles-canvas,
  #embers-canvas { opacity: var(--bg-effect-intensity, 1); }
  body.bg-pattern-dots {
    background-image: radial-gradient(color-mix(in srgb, var(--bg-effect-color, var(--fg)) calc(5% * var(--bg-effect-intensity, 1)), transparent) 1px, transparent 1px);
    background-size: 20px 20px; background-attachment: fixed;
  }
  body.bg-pattern-synapse {
    background-image: linear-gradient(color-mix(in srgb, var(--bg-effect-color, var(--fg)) calc(3.5% * var(--bg-effect-intensity, 1)), transparent) 1px, transparent 1px),
      linear-gradient(90deg, color-mix(in srgb, var(--bg-effect-color, var(--fg)) calc(3.5% * var(--bg-effect-intensity, 1)), transparent) 1px, transparent 1px);
    background-size: 24px 24px; background-attachment: fixed;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Fira Code', monospace;
    background: var(--bg); color: var(--fg);
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh; min-height: 100dvh;
    padding-top: 15vh;
    transition: padding-top 0.2s ease;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 2rem; width: 360px; max-width: 90vw;
    /* Sit above the bg-effect canvases (which spawn at z-index:0) so the
       falling rain / drifting petals / etc. don't streak across the
       login form. */
    position: relative; z-index: 1;
  }
  .logo {
    text-align: center; margin-bottom: 1.5rem;
  }
  .logo span {
    font-family: 'Fira Code', monospace;
    font-size: 2rem; font-weight: 600;
    letter-spacing: 0.04em;
    /* Same gradient as the main app's welcome-screen "Pantheon" title
       (static/style.css #welcome-screen .welcome-name) so the brand
       wordmark is consistent across login + first-launch screens.
       The gradient's far end read a bare `var(--fg)` where the rule it
       copies reads `var(--brand-mix-to, var(--fg))`, so a user who set
       "Logo Gradient End" saw it everywhere but here. Corrected with the
       key itself, which this page's ADV map was also missing. B21. */
    background: linear-gradient(135deg, var(--brand-color, var(--red)), color-mix(in srgb, var(--brand-color, var(--red)) 60%, var(--brand-mix-to, var(--fg))));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  /* `B1575`. The de-emphasis ladder `B1408` built in `style.css`: every rung
     lies between `--fg-muted` and `--fg`, both over 4.5:1 on `--panel` and
     `--bg`, so a lower N is still the quieter line and none is under the floor. */
  .setup-note { color: color-mix(in oklab, var(--fg) 60%, var(--fg-muted)); font-size: 0.8rem; margin-bottom: 1rem; text-align: center; }
  label { display: block; font-size: 0.85rem; margin-bottom: 0.3rem; color: color-mix(in oklab, var(--fg) 65%, var(--fg-muted)); }
  input:not(.remember-check) {
    width: 100%; padding: 0.6rem 0.8rem; margin-bottom: 1rem;
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    color: var(--fg); font-size: 0.95rem; font-family: 'Fira Code', monospace;
  }
  input:focus { outline: none; border-color: var(--red); }
  /* On touch devices keep inputs at >=16px so iOS Safari doesn't zoom the whole
     page when a field is focused (it auto-zooms any focused input under 16px).
     This page has its own inline styles, so it doesn't inherit the main app's
     equivalent rule in static/style.css; mirror it here. !important also lifts
     the dynamically-inserted 2FA input, which pins font-size:14px inline. */
  @media (hover: none) and (pointer: coarse) {
    input:not(.remember-check) { font-size: 16px !important; }
  }
  /* Clear, visible focus ring for keyboard users on every focusable control. */
  input:focus-visible, a:focus-visible, button:focus-visible {
    outline: 2px solid var(--red);
    outline-offset: 2px;
  }
  button {
    width: 100%;
    /* Asymmetric vertical padding nudges the label 1px down while keeping
       the button's total height the same as 0.7rem all-around. */
    padding: calc(0.7rem + 1px) 0.7rem calc(0.7rem - 1px);
    border: none; border-radius: 6px;
    /* Darken the brand red slightly so #fff label text clears the WCAG AA
       4.5:1 contrast threshold (plain --red #e06c75 only reaches ~3.2:1). */
    background: color-mix(in srgb, var(--red) 78%, #000); color: #fff; font-size: 1rem; cursor: pointer;
    font-weight: 600; font-family: 'Fira Code', monospace;
  }
  button:hover { background: color-mix(in srgb, var(--red) 66%, black); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  /* `B1575`. `#e55` measured 3.22:1 on `light`'s panel and under 4.5:1 on
     eleven palettes; `--color-error` is the app's error text, pinned over the
     floor on every palette (`tests/test_theme_contrast_floor_css.py`). */
  .error { color: var(--color-error); font-size: 0.85rem; margin-bottom: 0.75rem; display: none; }
  .toggle { text-align: center; margin-top: calc(1rem + 4px); font-size: 0.85rem; color: color-mix(in oklab, var(--fg) 50%, var(--fg-muted)); }
  /* `B1590`. The sign-up link was `--red`, which is a brand colour and not a
     text colour: 3.26:1 on `claude`, 2.56 on `cute`, 3.63 on `lavender`, 3.03
     on `light`, 3.72 on `organs`, 2.24 on `paper`. It is the ladder's top rung
     now — `--fg`, over 4.5:1 on `--panel` on every palette (`B1408`) — and
     underlined, so it reads as a link without leaning on a colour difference
     from the quieter line it sits in (WCAG 1.4.1). */
  .toggle a { color: var(--fg); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .toggle a:hover { text-decoration-thickness: 2px; }
  .pw-wrapper { position: relative; margin-bottom: 1rem; }
  .pw-wrapper input:not(.remember-check) { padding-right: 2.5rem; margin-bottom: 0; }
  .pw-toggle {
    position: absolute; right: 8px; top: 50%;
    /* +1px on the centering offset nudges the eye icon down 1px so it
       lines up visually with the input text baseline. */
    transform: translateY(calc(-50% + 1px));
    background: none; border: none; padding: 4px; cursor: pointer;
    color: color-mix(in oklab, var(--fg) 40%, var(--fg-muted)); width: auto;
    display: flex; align-items: center; justify-content: center;
  }
  .pw-toggle:hover { color: var(--fg); background: none; }
  .pw-toggle svg { display: block; }
  .remember-toggle {
    position: absolute !important; right: 13px; top: 50%; transform: translateY(-50%);
    background: none; border: none; padding: 2px; cursor: pointer;
    width: 14px !important; height: 14px !important; display: flex !important;
    align-items: center; justify-content: center;
    font-size: 0; margin: 0; color: transparent;
  }
  /* Visually hide the native checkbox but keep it in the accessibility tree
     and keyboard-focusable (display:none would drop it from tab order). It
     overlays the dot so a click/tap still toggles it. */
  .remember-toggle .remember-check {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%; margin: 0;
    opacity: 0; cursor: pointer;
  }
  .remember-toggle .remember-check:focus-visible + .remember-dot {
    outline: 2px solid var(--red); outline-offset: 2px;
  }
  .remember-toggle .remember-dot {
    display: block; width: 10px; height: 10px; min-width: 10px; min-height: 10px;
    border-radius: 50%;
    /* `B1575`. The remember-me switch's only outline: at 25% toward
       transparent it measured under 2:1, under the 3:1 a control's boundary
       needs (WCAG 1.4.11). Its checked fill is the same colour; hover is `--fg`. */
    border: 2px solid var(--fg-muted);
    background: transparent;
    transition: all 0.15s;
  }
  .remember-toggle .remember-check:checked + .remember-dot {
    border-color: transparent;
    background: var(--fg-muted);
  }
  .remember-toggle:hover .remember-dot {
    border-color: var(--fg);
  }
  /* P0-13: Pantheon's mark (docs/brand/pantheon-mark.svg), not upstream's boat. */
  .logo-mark { width: 1.6rem; height: 1.6rem; margin-right: 0.4rem; vertical-align: -0.15em; color: var(--red); }
  .version-label {
    position: fixed; bottom: 12px; right: 16px;
    /* `B1575`. Text at `opacity: 0.25` let three quarters of the page
       through; it is the quietest step there is that a person can still read. */
    font-size: 0.7rem; color: var(--fg-muted);
    font-family: 'Fira Code', monospace;
    pointer-events: none; user-select: none;
  }
  /* Whirlpool-style spinner shown in the submit button while login /
     account-creation work is in flight — replaces the previous "Loading…"
     text. Two-color ring (muted base + accent arc) rotates continuously. */
  .login-spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid color-mix(in srgb, var(--fg, #fff) 22%, transparent);
    border-top-color: var(--accent, var(--red, #e8a830));
    border-radius: 50%;
    animation: login-spin 0.7s linear infinite;
    vertical-align: -3px;
  }
  @keyframes login-spin { to { transform: rotate(360deg); } }

  /* `P10-05`. The one animation in this product that no reduced-motion guard
     reached. `P1-12` put a global guard in `static/style.css` and audited the
     149 keyframes there plus the ones `slashCommands.js` injects — but **this
     page does not load `style.css`**. It mirrors the palette by hand (see the
     `:root` note above) precisely so that the first paint of the login screen
     owes nothing to the app's stylesheet, and the cost of that is that it owes
     nothing to the app's guards either. So a person who has asked their
     operating system to stop moving things got a ring spinning at 86rpm on the
     first screen the product ever shows them.

     Same shape as the guard in `style.css`, deliberately, so there is one
     idiom rather than two: `0.01ms` and not `none`, because `none` means an
     `animationend` handler never fires and the "safer" spelling is the one
     that leaves state stuck; and `:is(#\9#\9#\9, *)` rather than `*`, so that
     an `!important` motion declaration added to this page later cannot
     silently out-rank it the way 21 of them already do in `style.css`. There
     is no such declaration here today — which is exactly when headroom is
     cheap. */
  @media (prefers-reduced-motion: reduce) {
    :is(#\9#\9#\9, *),
    :is(#\9#\9#\9, *)::before,
    :is(#\9#\9#\9, *)::after {
      animation-duration: 0.01ms !important;
      animation-delay: 0s !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      transition-delay: 0s !important;
      scroll-behavior: auto !important;
    }
  }

  /* ── The cockpit (2026-10-30), the accepted mockup's material on the one
     page the app's sheets never reach. Appended, so everything above still
     holds where this says nothing; every colour still derives from the five
     palette tokens the head script set, and the labels keep the ladder rungs
     check-contrast.py measures. ── */
  @font-face { font-family: 'Geist'; font-weight: 400; font-style: normal; font-display: swap; src: url('static/fonts/Geist-Regular.woff2') format('woff2'); }
  @font-face { font-family: 'Geist'; font-weight: 500; font-style: normal; font-display: swap; src: url('static/fonts/Geist-Medium.woff2') format('woff2'); }
  @font-face { font-family: 'Geist'; font-weight: 600; font-style: normal; font-display: swap; src: url('static/fonts/Geist-SemiBold.woff2') format('woff2'); }
  @font-face { font-family: 'Instrument Serif'; font-weight: 400; font-style: normal; font-display: swap; src: url('static/fonts/InstrumentSerif-Regular.woff2') format('woff2'); }
  :root {
    --ck-glass-base: color-mix(in oklab, var(--panel) 88%, var(--fg));
    --ck-edge: color-mix(in oklab, var(--fg) 13%, transparent);
    --ck-edge-hi: color-mix(in oklab, #fff 18%, transparent);
    --ck-tint: color-mix(in oklab, var(--fg) 7%, transparent);
    --ck-accent: var(--accent, var(--red));
    --ck-accent-2: color-mix(in oklch, var(--ck-accent) 70%, var(--fg));
    --ck-ui: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  :root[data-ck-tone="light"] { --ck-glass-base: color-mix(in oklab, var(--panel) 78%, #fff); --ck-edge-hi: color-mix(in oklab, #fff 55%, transparent); --ck-tint: color-mix(in oklab, var(--fg) 5%, transparent); }
  body { font-family: var(--ck-ui); -webkit-font-smoothing: antialiased; }
  .ck-field { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background: var(--bg); }
  .ck-field span { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .5; }
  .ck-field span:nth-child(1) { width: 52vw; height: 52vw; left: -12vw; top: -18vw; background: color-mix(in oklab, var(--red) 58%, var(--bg)); }
  .ck-field span:nth-child(2) { width: 44vw; height: 44vw; right: -14vw; top: 10vh; background: color-mix(in oklab, var(--fg) 40%, var(--bg)); opacity: .32; }
  .ck-field span:nth-child(3) { width: 40vw; height: 40vw; left: 22vw; bottom: -22vw; background: color-mix(in oklab, var(--border) 70%, var(--red) 30%); }
  .card {
    background: color-mix(in oklab, var(--ck-glass-base) 90%, transparent);
    -webkit-backdrop-filter: blur(28px) saturate(1.4); backdrop-filter: blur(28px) saturate(1.4);
    border: 1px solid var(--ck-edge); border-radius: 22px; padding: 2.25rem 2rem 2rem; width: 380px;
    box-shadow: inset 0 1px 0 var(--ck-edge-hi), 10px 30px 70px -20px color-mix(in srgb, #000 45%, transparent);
  }
  .logo { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 1.75rem; }
  .logo-mark { width: 1.9rem; height: 1.9rem; margin: 0; flex: none; color: var(--ck-accent); }
  .logo span {
    font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 2.75rem; letter-spacing: -.005em; line-height: 1;
    background: linear-gradient(120deg, var(--fg) 30%, var(--ck-accent-2) 70%, var(--ck-accent));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  label { font-size: 0.8rem; font-weight: 500; letter-spacing: 0; }
  input:not(.remember-check) {
    font-family: var(--ck-ui); background: var(--ck-tint); border: 1px solid var(--ck-edge); border-radius: 12px;
    padding: 0.7rem 0.9rem; transition: border-color .2s, box-shadow .2s, background .2s;
  }
  input:not(.remember-check):focus {
    border-color: color-mix(in oklab, var(--ck-accent) 45%, transparent);
    box-shadow: 0 0 0 4px color-mix(in oklab, var(--ck-accent) 15%, transparent);
  }
  button[type="submit"], #submitBtn {
    font-family: var(--ck-ui); border-radius: 999px; margin-top: .5rem; letter-spacing: 0;
    background: linear-gradient(135deg, color-mix(in srgb, var(--red) 78%, #000), color-mix(in srgb, color-mix(in oklch, var(--red) 70%, var(--fg)) 72%, #000));
    box-shadow: inset 0 1px 0 color-mix(in oklab, #fff 30%, transparent), 0 8px 20px -10px color-mix(in oklab, var(--ck-accent) 55%, transparent);
  }
  button[type="submit"]:hover, #submitBtn:hover { filter: brightness(1.08); }
  .version-label { font-family: var(--ck-ui); }
  /* The glass card sits a step lighter than `--panel`, so the error leans a
     quarter toward `--fg` to keep 4.5:1 on the palettes whose red is darkest. */
  .error { color: color-mix(in oklab, var(--color-error) 75%, var(--fg)); }
  /* 2026-10-31. Making an account: the card extends. The profile fields drop
     open under the username (grid rows 0fr → 1fr, so the card grows with
     them), and fold away for a sign-in. */
  .ck-extend { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .42s cubic-bezier(.2,.8,.2,1), opacity .3s ease; }
  .ck-extend.open { grid-template-rows: 1fr; opacity: 1; }
  .ck-extend-in { min-height: 0; overflow: hidden; }
  /* The longer card rises so its button stays on a laptop screen. */
  body:has(.card[data-mode="setup"]), body:has(.card[data-mode="signup"]) { padding-top: 5vh; padding-bottom: 5vh; }
  label .opt { font-weight: 400; color: var(--fg-muted); margin-left: .35rem; font-size: .72rem; letter-spacing: .02em; }
  .setup-note { font-size: .86rem; line-height: 1.45; margin-bottom: 1.25rem; }
  .setup-note strong { color: var(--fg); font-weight: 600; }
  .card[data-mode="setup"] .setup-note, .card[data-mode="signup"] .setup-note { text-align: left; }
  .card[data-mode="signup"] .setup-note { color: var(--fg); font-size: .95rem; font-weight: 500; }
  /* The setup's one choice: a switch, its words beside it. */
  .signup-choice { position: relative; display: flex; gap: 12px; align-items: flex-start; margin: .25rem 0 1rem; padding: .8rem .9rem;
    border-radius: 14px; background: var(--ck-tint); border: 1px solid var(--ck-edge); cursor: pointer; }
  .signup-choice .signup-check { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .signup-switch { flex: none; position: relative; width: 34px; height: 20px; margin-top: 1px; border-radius: 999px;
    background: color-mix(in oklab, var(--fg) 22%, transparent); transition: background .2s; }
  .signup-switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--panel); box-shadow: 0 1px 3px color-mix(in srgb, #000 35%, transparent); transition: transform .25s cubic-bezier(.2,.8,.2,1); }
  .signup-check:checked + .signup-switch { background: color-mix(in srgb, var(--red) 78%, #000); }
  .signup-check:checked + .signup-switch::after { transform: translateX(14px); background: #fff; }
  .signup-check:focus-visible + .signup-switch { outline: 2px solid var(--red); outline-offset: 2px; }
  .signup-words { display: flex; flex-direction: column; gap: 2px; }
  .signup-title { font-size: .85rem; font-weight: 500; color: var(--fg); }
  .signup-line { font-size: .75rem; line-height: 1.4; color: color-mix(in oklab, var(--fg) 60%, var(--fg-muted)); }
  @media (prefers-reduced-motion: reduce) { .ck-extend, .signup-switch, .signup-switch::after { transition: none; } }
</style>
</head>
<body>
<div class="ck-field" aria-hidden="true"><span></span><span></span><span></span></div>
<main class="card">
  <h1 class="logo">
    <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path fill="currentColor" fill-rule="evenodd" d="M5.18 12A11 11 0 0 1 26.82 12L25.74 12L16 7.82L6.26 12ZM16 10L30 16L2 16ZM4 18L28 18L28 20L4 20ZM5 20L8 20L8 26L5 26ZM11.33 20L14.33 20L14.33 26L11.33 26ZM17.67 20L20.67 20L20.67 26L17.67 26ZM24 20L27 20L27 26L24 26ZM2 26L30 26L30 28L2 28Z"/></svg><span>Pantheon</span>
  </h1>
  <p class="setup-note" id="setupNote" style="display:none"></p>

  <div class="error" id="error" role="alert" aria-live="assertive"></div>

  <form id="authForm" method="post" autocomplete="on">
    <label for="username">Username</label>
    <div class="pw-wrapper">
      <input id="username" name="username" type="text" required autofocus autocomplete="username">
      <label class="remember-toggle" id="rememberToggle" title="Remember me">
        <input type="checkbox" class="remember-check" id="remember" checked aria-label="Remember me">
        <span class="remember-dot" aria-hidden="true"></span>
      </label>
    </div>

    <!-- 2026-10-31. Making an account extends the card: who the person is
         (all optional) drops open under the username, and folds away again
         for a plain sign-in. -->
    <div class="ck-extend" id="profileGroup" inert>
      <div class="ck-extend-in">
        <label for="displayName">Display name <span class="opt">optional</span></label>
        <input id="displayName" name="display_name" type="text" autocomplete="name" maxlength="64">
        <label for="email">Email <span class="opt">optional</span></label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" inputmode="email">
        <div id="phoneGroup">
          <label for="phone">Phone <span class="opt">optional</span></label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="32">
        </div>
      </div>
    </div>

    <label for="password">Password</label>
    <div class="pw-wrapper">
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <button type="button" class="pw-toggle" id="pwToggle" tabindex="-1" aria-label="Show password">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><line x1="8" y1="16" x2="16" y2="8"/><line x1="8" y1="8" x2="16" y2="16"/></svg>
      </button>
    </div>

    <div id="confirmGroup" style="display:none">
      <label for="confirmPassword">Confirm Password</label>
      <div class="pw-wrapper">
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password">
        <button type="button" class="pw-toggle" id="pwToggleConfirm" tabindex="-1" aria-label="Show password">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><line x1="8" y1="16" x2="16" y2="8"/><line x1="8" y1="8" x2="16" y2="16"/></svg>
        </button>
      </div>
    </div>

    <label class="signup-choice" id="signupChoice" for="allowSignup" style="display:none">
      <input type="checkbox" class="remember-check signup-check" id="allowSignup" checked>
      <span class="signup-switch" aria-hidden="true"></span>
      <span class="signup-words"><span class="signup-title">Let people create their own accounts</span>
        <span class="signup-line">Anyone who can open this page can sign up. You can change it later in Settings.</span></span>
    </label>

    <button type="submit" id="submitBtn">Sign In</button>
  </form>

  <div class="toggle" id="toggleArea" style="display:none">
    <span id="toggleText">Don't have an account? </span>
    <a id="toggleLink" href="#">Sign up</a>
  </div>
</main>

<footer class="version-label" id="version-label"></footer>

<script>
(async () => {
  const appUrl = window.__pantheonLoginAppUrl || ((path) => path);
  // `B1422`. A sign-in that cannot reach the server said "Failed to fetch",
  // and one whose proxy answered with an error page said "Unexpected token
  // '<'". Neither tells a person that the password is not the problem.
  // `fetch` rejects with a TypeError only when nothing answered at all.
  function notJson(res) {
    if ((res.headers.get('content-type') || '').includes('application/json')) return null;
    const e = new Error(`HTTP ${res.status}`);
    e.notPantheon = true;
    e.httpStatus = res.status;
    return e;
  }
  function reachMessage(err) {
    if (err && (err.name === 'TypeError' || err instanceof TypeError)) {
      return "Pantheon's server isn't answering, so nobody can sign in right now — "
        + 'your password is not the problem. Check that the server is running, then reload.';
    }
    if (err && err.notPantheon) {
      return `Something answered at this address (HTTP ${err.httpStatus}), but it was not `
        + 'Pantheon — usually a proxy or tunnel whose Pantheon server is down. Check that the '
        + 'server is running, then reload.';
    }
    return (err && err.message) || String(err);
  }
  // `B1665`. The submit handler below is attached only once the status check
  // has answered, and until then a press of Sign In was the browser's own
  // submit: a GET to `/login?username=…&password=…`, the password in the
  // address bar, the history and the server's access log — for seconds, on a
  // busy server. The form is held from here; a press made while it is held is
  // made again, through the handler, as soon as the handler is there.
  const form = document.getElementById('authForm');
  let formReady = false;
  let pressedEarly = false;
  form.addEventListener('submit', (e) => {
    if (formReady) return;
    e.preventDefault();
    pressedEarly = true;
  });
  // Load version
  try {
    const vr = await fetch(appUrl('/api/version'));
    if (vr.ok) {
      const vd = await vr.json();
      document.getElementById('version-label').textContent = 'v' + vd.version;
    }
  } catch(e) {}

  // Prefill last username
  const usernameInput = document.getElementById('username');
  const savedUser = localStorage.getItem('pantheon-last-user');
  if (savedUser && usernameInput) {
    usernameInput.value = savedUser;
    document.getElementById('password').focus();
  }

  const errEl = document.getElementById('error');
  const setupNote = document.getElementById('setupNote');
  const confirmGroup = document.getElementById('confirmGroup');
  const submitBtn = document.getElementById('submitBtn');
  const toggleArea = document.getElementById('toggleArea');
  const toggleLink = document.getElementById('toggleLink');
  const toggleText = document.getElementById('toggleText');
  const profileGroup = document.getElementById('profileGroup');
  const phoneGroup = document.getElementById('phoneGroup');
  const signupChoice = document.getElementById('signupChoice');
  const card = document.querySelector('.card');
  // The extended part of the card: open for making an account, folded for a sign-in.
  function extend(open, withPhone) {
    profileGroup.classList.toggle('open', open);
    profileGroup.inert = !open;
    phoneGroup.style.display = withPhone ? '' : 'none';
  }

  let mode = 'login'; // 'login' | 'signup' | 'setup'
  let signupAllowed = false;
  let policy = { password_min_length: 8, reserved_usernames: [] };

  const rememberToggle = document.getElementById('rememberToggle');

  function setMode(m) {
    mode = m;
    errEl.style.display = 'none';
    card.dataset.mode = m;
    if (m === 'setup') {
      // A fresh install: no account exists, so this one runs the place.
      setupNote.innerHTML = '<strong>Welcome.</strong> Pantheon has no accounts yet. '
        + 'Make the first one: it is the admin, and it can add everyone else.';
      setupNote.style.display = 'block';
      confirmGroup.style.display = 'block';
      extend(true, false);
      signupChoice.style.display = '';
      submitBtn.textContent = 'Create Admin Account';
      toggleArea.style.display = 'none';
      rememberToggle.style.display = 'none';
    } else if (m === 'signup') {
      setupNote.textContent = 'Create your account';
      setupNote.style.display = 'block';
      confirmGroup.style.display = 'block';
      extend(true, true);
      signupChoice.style.display = 'none';
      submitBtn.innerHTML = '<span style="position:relative;top:1px;">Create Account</span>';
      toggleArea.style.display = 'block';
      toggleText.textContent = 'Already have an account? ';
      toggleLink.style.display = '';
      toggleLink.textContent = 'Sign in';
      rememberToggle.style.display = 'none';
    } else {
      setupNote.style.display = 'none';
      confirmGroup.style.display = 'none';
      extend(false, false);
      signupChoice.style.display = 'none';
      submitBtn.textContent = 'Sign In';
      // The landing always says how to get an account: the sign-up door when
      // the admin has opened it, and who to ask when they have not.
      toggleArea.style.display = 'block';
      if (signupAllowed) {
        toggleText.textContent = "Don't have an account? ";
        toggleLink.style.display = '';
        toggleLink.textContent = 'Sign up';
      } else {
        toggleText.textContent = 'Need an account? Ask your admin for one.';
        toggleLink.style.display = 'none';
      }
      rememberToggle.style.display = '';
    }
  }

  // Check auth status and fetch policy in parallel, but don't block the
  // authenticated redirect on the policy response.
  const policyPromise = fetch(appUrl('/api/auth/policy'), { credentials: 'same-origin' }).catch(() => null);
  try {
    const statusRes = await fetch(appUrl('/api/auth/status'), { credentials: 'same-origin' });
    const bad = notJson(statusRes);
    if (bad) throw bad;
    const data = await statusRes.json();
    if (data.authenticated) {
      window.location.replace(appUrl('/'));
      return;
    }
    signupAllowed = !!data.signup_enabled;
    if (!data.configured) {
      setMode('setup');
    } else {
      setMode('login');
    }
    const policyRes = await policyPromise;
    if (policyRes && policyRes.ok) {
      policy = await policyRes.json();
    }
  } catch (e) {
    setMode('login');
    // `B1422`. Say now that nobody can sign in, not after a password is typed.
    errEl.textContent = reachMessage(e);
    errEl.style.display = 'block';
  }

  toggleLink.addEventListener('click', (e) => {
    e.preventDefault();
    setMode(mode === 'login' ? 'signup' : 'login');
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.style.display = 'none';
    submitBtn.disabled = true;

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    // If in TOTP mode, handle the code submission directly
    if (form._totpMode) {
      const totpInput = document.getElementById('totp-input');
      const code = totpInput ? totpInput.value.trim() : '';
      if (!code) { totpInput.focus(); submitBtn.disabled = false; return; }
      const remember = document.getElementById('remember').checked;
      try {
        const res = await fetch(appUrl('/api/auth/login'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username, password, remember, totp_code: code })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Invalid code');
        if (!data.ok) throw new Error('Login failed');
        form._totpMode = false;
        finishLogin();
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        submitBtn.disabled = false;
      }
      return;
    }

    // Validate confirm password for setup/signup
    if (mode === 'setup' || mode === 'signup') {
      const confirm = document.getElementById('confirmPassword').value;
      if (password !== confirm) {
        errEl.textContent = 'Passwords do not match';
        errEl.style.display = 'block';
        submitBtn.disabled = false;
        return;
      }
      if (password.length < policy.password_min_length) {
        errEl.textContent = `Password must be at least ${policy.password_min_length} characters`;
        errEl.style.display = 'block';
        submitBtn.disabled = false;
        return;
      }
      if (policy.reserved_usernames.includes(username.toLowerCase())) {
        errEl.textContent = 'This username is reserved';
        errEl.style.display = 'block';
        submitBtn.disabled = false;
        return;
      }
    }

    // Setup or signup first
    if (mode === 'setup' || mode === 'signup') {
      const endpoint = mode === 'setup' ? appUrl('/api/auth/setup') : appUrl('/api/auth/signup');
      try {
        const made = { username, password };
        const val = (id) => (document.getElementById(id).value || '').trim();
        if (val('displayName')) made.display_name = val('displayName');
        if (val('email')) made.email = val('email');
        if (mode === 'signup' && val('phone')) made.phone = val('phone');
        if (mode === 'setup') made.allow_signup = document.getElementById('allowSignup').checked;
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify(made)
        });
        const bad = notJson(res);
        if (bad) throw bad;
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Account creation failed');
      } catch (err) {
        errEl.textContent = reachMessage(err);
        errEl.style.display = 'block';
        submitBtn.disabled = false;
        return;
      }
    }

    // Login (auto-login after setup/signup too)
    const remember = document.getElementById('remember').checked;
    function finishLogin() {
      const _rem = document.getElementById('remember').checked;
      if (_rem) localStorage.setItem('pantheon-last-user', username);
      else localStorage.removeItem('pantheon-last-user');
      sessionStorage.removeItem('pan-session-active');
      submitBtn.innerHTML = '<span class="login-spinner" aria-hidden="true"></span>';
      submitBtn.disabled = true;
      Promise.all([
        fetch(appUrl('/api/sessions'), { credentials: 'same-origin' }).then(r => {
          // `P23-07`: whether the sidebar has older chats to offer (`X-More-Chats`).
          sessionStorage.setItem('pan-prefetch-sessions-more', r.headers.get('X-More-Chats') || '');
          return r.json();
        }),
        fetch(appUrl('/api/auth/features'), { credentials: 'same-origin' }).then(r => r.json()),
        fetch(appUrl('/api/auth/settings'), { credentials: 'same-origin' }).then(r => r.json()),
      ]).then(([sess, feat, sett]) => {
        sessionStorage.setItem('pan-prefetch-sessions', JSON.stringify(sess));
        sessionStorage.setItem('pan-prefetch-features', JSON.stringify(feat));
        sessionStorage.setItem('pan-prefetch-settings', JSON.stringify(sett));
      }).catch(() => {}).finally(() => { window.location.replace(appUrl('/')); });
    }
    async function doLogin(totpCode) {
      const loginBody = { username, password, remember };
      if (totpCode) loginBody.totp_code = totpCode;
      const res = await fetch(appUrl('/api/auth/login'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(loginBody)
      });
      const bad = notJson(res);
      if (bad) throw bad;
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Login failed');
      return data;
    }
    try {
      let data = await doLogin();
      // 2FA required — show TOTP input
      if (data.requires_totp) {
        submitBtn.disabled = false;
        // Only add TOTP input once
        if (document.getElementById('totp-input')) return;
        form._totpMode = true;
        const totpWrap = document.createElement('div');
        totpWrap.style.cssText = 'margin-top:12px;';
        totpWrap.innerHTML = '<label for="totp-input" style="font-size:0.85em;display:block;margin-bottom:4px;">2FA Code</label><input type="text" id="totp-input" placeholder="Enter 6-digit code" aria-label="Two-factor authentication code" autocomplete="one-time-code" inputmode="numeric" maxlength="8" style="width:100%;padding:10px 12px;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:8px;font-size:14px;box-sizing:border-box;text-align:center;letter-spacing:4px;">';
        const formEl = submitBtn.parentElement;
        formEl.insertBefore(totpWrap, submitBtn);
        const totpInput = document.getElementById('totp-input');
        totpInput.focus();
        submitBtn.textContent = 'Verify';
        return;
      }
      finishLogin();
    } catch (err) {
      errEl.textContent = reachMessage(err);
      errEl.style.display = 'block';
      submitBtn.disabled = false;
      return;
    }
  });
  formReady = true;
  if (pressedEarly) form.requestSubmit();

  // Password show/hide toggles
  const eyeOpen = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  const eyeClosed = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><line x1="8" y1="16" x2="16" y2="8"/><line x1="8" y1="8" x2="16" y2="16"/></svg>';

  function wireToggle(btnId, inputId) {
    const btn = document.getElementById(btnId);
    const inp = document.getElementById(inputId);
    if (!btn || !inp) return;
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      btn.innerHTML = show ? eyeOpen : eyeClosed;
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      inp.focus();
    });
  }
  wireToggle('pwToggle', 'password');
  wireToggle('pwToggleConfirm', 'confirmPassword');
})();

// Prevent login button and eye toggles from stealing focus on mobile (keeps keyboard open)
document.querySelectorAll('#submitBtn, .pw-toggle').forEach(btn => {
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); }, { passive: false });
  btn.addEventListener('touchend', (e) => {
    e.preventDefault();
    btn.click();
  });
});

// Mobile keyboard: shift card up when virtual keyboard opens
if (window.visualViewport) {
  const card = document.querySelector('.card');
  window.visualViewport.addEventListener('resize', () => {
    const vvh = window.visualViewport.height;
    const wh = window.innerHeight;
    if (vvh < wh * 0.8) {
      document.body.style.paddingTop = '5vh';
      // Keep the active input visible without jumping the whole card to the top
      if (document.activeElement && document.activeElement.tagName === 'INPUT') {
        // `P1-15`. No `behavior` at all, rather than a second copy of the
        // media query. Everywhere else the answer is `scrollBehavior()` from
        // static/js/motion.js, which 50 sites now import; this block is not a
        // module (the module block starts further down) and the handler has to
        // be attached before one is fetched, so it cannot import it.
        //
        // The third option is the right one here: the scroll is not a flourish.
        // It exists because the on-screen keyboard has just covered the field
        // the person is typing in, and putting that field back in view is the
        // correctness action — instantly is *better*, not merely acceptable, and
        // it is what every browser does with no `behavior` given. So this site
        // is removed rather than guarded, and
        // `test_the_one_copy_of_the_query_outside_a_module_is_the_one_that_has_to_be`
        // keeps holding that `index.html`'s boot loader is the only page-level
        // copy of the query — which it should, because it is.
        document.activeElement.scrollIntoView({ block: 'center' });
      }
    } else {
      document.body.style.paddingTop = '';
    }
  });
}
</script>
<script type="module">
// Drive the login page's bg effect off the user's saved theme. The
// sync bootstrap above already set the body class + effect CSS vars so
// the static-gradient patterns (dots, synapse) paint immediately; this
// block imports theme.js's canvas implementations for the dynamic
// patterns (rain, constellations, perlin-flow, petals, sparkles,
// embers, synapse pulses).
//
// IMPORTANT: theme.js's auto-init (`_initWithSync` → `initThemeUI`)
// early-returns at `#themeGrid` which doesn't exist on this page, so
// `applyBgPattern` would never fire on its own. We call it directly
// here against the pattern the bootstrap already chose.
try {
  const tm = await import((window.__pantheonLoginAppUrl || ((path) => path))('/static/js/theme.js'));
  const pattern = window.__loginBgPattern;
  if (pattern && tm.applyBgPattern) tm.applyBgPattern(pattern);
} catch (e) {
  console.error('[login-bg] failed:', e);
}
</script>
</body>
